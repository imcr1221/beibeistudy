<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语拼读探险 · Phonics Lab</title><style>:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#25344a;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#5069d9,#8b69d9);color:white;padding:30px max(22px,calc((100vw - 1100px)/2))}h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}header p{margin:0;opacity:.94}.wrap{max-width:1100px;margin:auto;padding:22px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}button{cursor:pointer;font:inherit;border:0;border-radius:13px;padding:11px 16px}.tab{background:#e5eafa;color:#35446e}.tab.active{background:#5269d6;color:white}.panel{display:none}.panel.active{display:block}.intro{background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 20px #25344a0b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 20px #25344a0b}.pattern{font-size:32px;color:#5269d6;font-weight:800}.word{font-size:25px;font-weight:750;margin:12px 0 4px}.meaning{color:#5e6980}.speak{background:#e8efff;color:#344fc1;margin-top:12px}.note{font-size:14px;color:#58647a;line-height:1.65}.quiz{background:white;padding:22px;border-radius:18px;max-width:720px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.choice{background:#edf0fa;color:#26385d;font-size:20px}.choice.correct{background:#c6efd8}.choice.wrong{background:#ffd6d6}.feedback{min-height:28px;font-weight:700}.next{background:#5269d6;color:white}.small{font-size:13px;color:#67748a}footer{text-align:center;padding:24px;color:#69758b}@media(max-width:480px){.choices{grid-template-columns:1fr}}.builder{background:#fff;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 4px 20px #25344a0b}.segments{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.segment{font-size:23px;font-weight:750;background:#e5efff;color:#2b4c9d;min-width:65px}.segment.played{background:#c8efd9;color:#176343}.progressbar{height:12px;border-radius:20px;background:#e2e8f5;overflow:hidden}.progressfill{height:100%;background:#6b7ddf;transition:width .3s}.pill{display:inline-block;background:#edf2ff;border-radius:20px;padding:5px 12px;margin:4px;font-size:13px}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.level{background:#e6eafa}.level.active{background:#5269d6;color:#fff}.practice{background:#f4f7ff;border-radius:14px;padding:16px;margin-top:12px}.practice input{font:inherit;border:1px solid #bac8e2;border-radius:10px;padding:10px;width:min(100%,330px)}.practice button{background:#5269d6;color:white;margin:6px}.feedback{line-height:1.6}select{padding:8px;border-radius:8px;border:1px solid #c9d4eb}button:focus-visible{outline:3px solid #e6a63c;outline-offset:2px}button:disabled{opacity:.65;cursor:default} </style></head><body><header><h1>🔤 英语拼读探险</h1><p>听一听 · 拼一拼 · 找规律 · 自己读出新单词</p></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="content"></div></main><footer>发音使用浏览器英语语音 · 建议使用 Chrome 或 Edge</footer><script>
const units=[
{title:'短元音',emoji:'🍎',intro:'短元音通常出现在“辅音 + 元音 + 辅音”的单词中。点击单词听发音。',items:[['a','cat','猫','a 常发短音 /æ/'],['e','bed','床','e 常发 /e/'],['i','sit','坐','i 常发 /ɪ/'],['o','hot','热的','o 常发 /ɒ/（英式）或 /ɑ/（美式）'],['u','cup','杯子','u 常发 /ʌ/']]},
{title:'长元音',emoji:'🪄',intro:'有些单词里的元音读起来像字母名称。末尾不发音的 e 常常改变前面的元音。',items:[['a_e','cake','蛋糕','a 发字母名称的音，末尾 e 通常不发音'],['i_e','bike','自行车','i 发字母名称的音'],['o_e','home','家','o 发字母名称的音'],['ee','see','看见','ee 常发长 /iː/'],['oa','boat','船','oa 常发 /əʊ/（英式）或 /oʊ/（美式）']]},
{title:'辅音组合',emoji:'🚂',intro:'两个字母放在一起，有时表示一个新的音。',items:[['sh','ship','船','sh 通常发 /ʃ/'],['ch','chair','椅子','ch 通常发 /tʃ/'],['th','think','思考','th 在 think 中发 /θ/'],['th','this','这个','th 在 this 中发 /ð/'],['ph','phone','电话','ph 常发 /f/']]},
{title:'元音组合',emoji:'🌈',intro:'相同的字母组合不一定只有一种读音，比较不同单词更容易记住。',items:[['ea','sea','大海','ea 在 sea 中发 /iː/'],['ea','head','头','ea 在 head 中发 /e/'],['ai','rain','雨','ai 常发 /eɪ/'],['ar','car','汽车','ar 在 car 中的发音因英美口音不同'],['or','fork','叉子','or 的读音因口音而异'],['ear','hear','听见','ear 在 hear 中常发 /ɪə/（英式）'],['ear','early','早的','ear 在 early 中并不读成 hear 的音'],['air','hair','头发','air 在 hair 中常发 /eə/（英式）']]},
{title:'音节与重音',emoji:'👏',intro:'较长的单词可以分成音节，再听听哪一部分更响亮。',items:[['2 音节','TA-ble','桌子','table：重音在第一个音节'],['2 音节','HAP-py','开心的','happy：重音在第一个音节'],['3 音节','BA-na-na','香蕉','banana：重音在第二个音节，ba-NA-na'],['3 音节','COM-pu-ter','电脑','computer：重音在第二个音节，com-PU-ter']]},
{title:'特殊单词',emoji:'⭐',intro:'有些高频词不能直接按最常见的拼读规则读，要单独记住。',items:[['特殊','one','一','one 不按字母 o 的常见短元音规则读'],['特殊','two','二','w 不发音'],['特殊','said','说（过去式）','ai 在 said 中发 /e/'],['特殊','have','有','末尾 e 不会让 a 变成长元音'],['特殊','went','去（过去式）','go 的过去式是 went；这是语法变化，不是拼读规则']]}
];
const blendData=[
{word:'ship',meaning:'船',parts:['sh','i','p'],sounds:['sh','i as in sit','p'],note:'sh 合起来表示一个音 /ʃ/。',level:1},
{word:'chip',meaning:'薯片',parts:['ch','i','p'],sounds:['ch','i as in sit','p'],note:'ch 通常发 /tʃ/。',level:1},
{word:'cat',meaning:'猫',parts:['c','a','t'],sounds:['k','a as in cat','t'],note:'短元音 a。',level:1},
{word:'fish',meaning:'鱼',parts:['f','i','sh'],sounds:['f','i as in sit','sh'],note:'末尾 sh 是一个音。',level:1},
{word:'cake',meaning:'蛋糕',parts:['c','a_e','k'],sounds:['k','ay','k'],note:'末尾不发音的 e 让 a 读长元音。',level:2},
{word:'bike',meaning:'自行车',parts:['b','i_e','k'],sounds:['b','eye','k'],note:'i_e 表示长元音 /aɪ/。',level:2},
{word:'rain',meaning:'雨',parts:['r','ai','n'],sounds:['r','ay','n'],note:'ai 常发 /eɪ/。',level:2},
{word:'boat',meaning:'船',parts:['b','oa','t'],sounds:['b','oh','t'],note:'oa 常发长 o 的音。',level:2},
{word:'sheep',meaning:'绵羊',parts:['sh','ee','p'],sounds:['sh','ee','p'],note:'ee 通常发 /iː/。',level:2},
{word:'think',meaning:'思考',parts:['th','i','n','k'],sounds:['th as in think','i as in sit','n','k'],note:'th 的舌尖轻触上下齿之间。',level:3},
{word:'chair',meaning:'椅子',parts:['ch','air'],sounds:['ch','air'],note:'air 常组合成一个韵母音。',level:3},
{word:'early',meaning:'早的',parts:['ear','ly'],sounds:['ur as in bird','lee'],note:'ear 在 early 中和 hear 中读音不同，要结合单词记忆。',level:3}
];
let currentBlend=0,level=1,attempts=0,correct=0,done=new Set();
const key='phonics-lab-progress-v2';try{const saved=JSON.parse(localStorage.getItem(key)||'{}');done=new Set(saved.done||[]);attempts=saved.attempts||0;correct=saved.correct||0}catch(e){}
function saveProgress(){try{localStorage.setItem(key,JSON.stringify({done:[...done],attempts,correct}))}catch(e){}}
function renderProgress(){const total=blendData.length;return `<div class="intro"><h3>📈 我的学习进度</h3><div class="progressbar"><div class="progressfill" style="width:${Math.round(done.size/total*100)}%"></div></div><p>${done.size} / ${total} 个拼读词已练习　·　答题正确 ${correct} / ${attempts}</p><p class="small">进度保存在当前浏览器。更换设备或清除浏览器数据后可能消失。</p><button class="speak" id="resetProgress">清空学习记录</button></div>`}
function renderBlend(){const choices=blendData.filter(x=>x.level===level);if(!choices.some(x=>blendData.indexOf(x)===currentBlend))currentBlend=blendData.indexOf(choices[0]);const w=blendData[currentBlend];return `<div class="intro"><h2>🧩 拆音 · 合音 · 拼读</h2><p>先点击每个字母块，听它代表的声音；再点击“连起来读”，听完整单词。单独音素的播放是近似示范，部分声音不能用普通语音引擎准确单独发出，最终以完整单词为准。</p><div class="levels">${[1,2,3].map(n=>`<button class="level ${level===n?'active':''}" data-level="${n}">${['','基础','进阶','挑战'][n]}</button>`).join('')}</div><label for="wordSelect">选择单词：</label> <select id="wordSelect">${choices.map(x=>`<option value="${blendData.indexOf(x)}" ${x===w?'selected':''}>${x.word} · ${x.meaning}${done.has(x.word)?' ✓':''}</option>`).join('')}</select></div><div class="builder"><p class="small">${['','基础','进阶','挑战'][level]} · ${w.meaning}</p><div class="segments">${w.parts.map((part,i)=>`<button class="segment" data-part="${i}" aria-label="播放 ${part} 的声音">${part}</button>`).join('')}</div><button class="speak" id="blendAll">🔊 连起来读：${w.word}</button> <button class="speak" id="blendSlow">🐢 慢速听完整单词</button><p class="note">💡 ${w.note}</p><div class="practice"><strong>✏️ 听写小挑战</strong><p>点击听音，不看上方单词，试着在输入框中拼出来。</p><button id="dictation">🔊 听单词</button><div><input id="spellInput" autocomplete="off" spellcheck="false" placeholder="输入听到的英语单词" aria-label="拼写答案"><button id="checkSpell">检查答案</button></div><p id="spellFeedback" class="feedback" aria-live="polite"></p></div><p><button class="next" id="markDone">✓ 我学会这个词了</button> <button class="speak" id="nextBlend">下一个单词 →</button></p></div>${renderProgress()}`}
const tabs=document.getElementById('tabs'),content=document.getElementById('content');let active=0,question=0,score=0,locked=false;
function speak(word,overrideRate){if(!('speechSynthesis'in window)){alert('当前浏览器不支持朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang=document.getElementById('accent')?.value||'en-GB';u.rate=overrideRate||Number(document.getElementById('speed')?.value||.8);speechSynthesis.speak(u)}
function render(){tabs.innerHTML=units.map((u,i)=>`<button class="tab ${i===active?'active':''}" data-tab="${i}">${u.emoji} ${u.title}</button>`).join('')+'<button class="tab '+(active===6?'active':'')+'" data-tab="6">🎯 拼读挑战</button><button class="tab '+(active===7?'active':'')+'" data-tab="7">🧩 拆音合音</button>';let settings='<div class="intro"><label>口音 <select id="accent"><option value="en-GB">英式英语</option><option value="en-US">美式英语</option></select></label>　<label>朗读速度 <select id="speed"><option value="0.65">慢速</option><option value="0.8" selected>适中</option><option value="1">正常</option></select></label><p class="small">语音由设备提供，实际发音可能因系统语音包而异。</p></div>';if(active===7){content.innerHTML=settings+renderBlend()}else if(active===6){content.innerHTML=settings+'<div class="quiz"><h2>🎯 听音选单词</h2><p>点击喇叭，听单词，然后选出你听到的英文。</p><div id="quizArea"></div></div>';showQuestion()}else{let u=units[active];content.innerHTML=settings+`<div class="intro"><h2>${u.emoji} ${u.title}</h2><p>${u.intro}</p></div><div class="cards">`+u.items.map(x=>`<article class="card"><div class="pattern">${x[0]}</div><div class="word">${x[1]}</div><div class="meaning">${x[2]}</div><button class="speak" data-speak="${x[1].replace(/^[A-Z]+-/,'').replace(/-/g,'')}">🔊 听发音</button><p class="note">${x[3]}</p></article>`).join('')+'</div>'} }
const questions=[{word:'ship',opts:['ship','chip','shop','sheep']},{word:'cake',opts:['cat','cake','kick','cook']},{word:'rain',opts:['run','rain','ran','ring']},{word:'think',opts:['this','sink','think','thin']},{word:'head',opts:['head','hear','heat','hide']},{word:'early',opts:['ear','early','easy','every']},{word:'boat',opts:['boot','boat','bat','bit']},{word:'phone',opts:['fun','phone','pen','fan']}];
function showQuestion(){locked=false;if(question>=questions.length){document.getElementById('quizArea').innerHTML=`<h2>完成啦！🎉</h2><p>答对 ${score} / ${questions.length} 题</p><button class="next" id="restart">再挑战一次</button>`;return}const q=questions[question];document.getElementById('quizArea').innerHTML=`<p>第 ${question+1} / ${questions.length} 题　·　得分 ${score}</p><button class="speak" id="listen">🔊 播放单词</button><div class="choices">${q.opts.map(o=>`<button class="choice" data-answer="${o}">${o}</button>`).join('')}</div><p class="feedback" id="feedback"></p><button class="next" id="next" style="display:none">下一题 →</button>`}
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.level){level=Number(t.dataset.level);render();return}if(t.id==='resetProgress'){if(confirm('确定清空学习进度吗？')){done.clear();attempts=0;correct=0;saveProgress();render()}return}if(t.id==='markDone'){done.add(blendData[currentBlend].word);saveProgress();render();return}if(t.id==='nextBlend'){const arr=blendData.map((x,i)=>({x,i})).filter(o=>o.x.level===level);const idx=arr.findIndex(o=>o.i===currentBlend);currentBlend=arr[(idx+1)%arr.length].i;render();return}if(t.dataset.part!==undefined){const i=Number(t.dataset.part);const b=blendData[currentBlend];document.querySelectorAll('.segment').forEach((el,j)=>el.classList.toggle('played',j===i));speak(b.sounds[i]);return}if(t.id==='blendAll'||t.id==='dictation'){speak(blendData[currentBlend].word);return}if(t.id==='blendSlow'){speak(blendData[currentBlend].word,.58);return}if(t.id==='checkSpell'){const val=document.getElementById('spellInput').value.trim().toLowerCase();const good=val===blendData[currentBlend].word;attempts++;if(good){correct++;done.add(blendData[currentBlend].word)}saveProgress();document.getElementById('spellFeedback').textContent=good?'🌟 拼对了！非常棒！':'再试试！提示：'+blendData[currentBlend].parts.join(' · ');return}if(t.dataset.tab!==undefined){active=Number(t.dataset.tab);render()}else if(t.dataset.speak){speak(t.dataset.speak)}else if(t.id==='listen'){speak(questions[question].word)}else if(t.dataset.answer&&!locked){locked=true;let good=t.dataset.answer===questions[question].word;if(good)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===questions[question].word)b.classList.add('correct');else if(b===t)b.classList.add('wrong')});document.getElementById('feedback').textContent=good?'答对啦！太棒了！🌟':'再听一次，正确答案是 '+questions[question].word;document.getElementById('next').style.display='inline-block'}else if(t.id==='next'){question++;showQuestion()}else if(t.id==='restart'){question=0;score=0;showQuestion()}});document.addEventListener('change',e=>{if(e.target.id==='wordSelect'){currentBlend=Number(e.target.value);render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='spellInput'){document.getElementById('checkSpell').click()}});render();
</script></body></html>

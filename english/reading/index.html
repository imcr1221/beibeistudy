*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#eef6ff,#fff9ed 55%,#f3efff);color:#25365c;min-height:100vh}button,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:20px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 20px}.top a{color:#536ea6;text-decoration:none;font-weight:750}.hero{border-radius:27px;padding:32px;background:linear-gradient(110deg,#4566c9,#7968d7,#dd7997);color:white}.hero h1{margin:7px 0;font-size:clamp(28px,4vw,42px)}.hero p{line-height:1.65;margin-bottom:0}.notice{margin:17px 0;padding:13px 17px;border-radius:14px;background:#fff8df;font-size:13px;line-height:1.7}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.tab,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800}.tab{background:white;color:#53668e}.tab.active,.btn.primary{background:#506ed2;color:white}.btn{background:#e5edff;color:#304d92}.btn.green{background:#e0f6e9;color:#16774e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card,.panel{background:#ffffffdf;border-radius:20px;padding:20px;box-shadow:0 8px 25px #394d7813}.card h3{margin:6px 0}.muted{color:#687b9d;font-size:14px;line-height:1.6}.pill{font-size:12px;font-weight:800;background:#edf1ff;border-radius:30px;padding:5px 9px;display:inline-block}.reading p{line-height:2;font-size:17px;margin:16px 0}.section{margin-top:18px}.q{background:#f4f7ff;border-radius:14px;padding:15px;margin:12px 0}.q b{display:block;margin-bottom:10px}.options{display:grid;gap:7px}.option{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:white}.option:has(input:checked){outline:2px solid #7892eb}.feedback{font-size:13px;margin:8px 0;line-height:1.6}.good{color:#147b4c}.bad{color:#b34743}.textinput{width:100%;min-height:75px;border:1px solid #c8d5e8;border-radius:11px;padding:10px;res </style></head><body><main class="wrap"><header class="top"><b>🇬🇧 English · Åk 6</b><a href="../index.html">← 返回英语目录</a></header><section class="hero"><small>READING COMPREHENSION · GRADE 6</small><h1>📚 Reading Adventure</h1><p>5篇原创阅读文章 · 3篇选词填空 · 选择题、判断题、简答题、词汇与语境理解<br>适合瑞典六年级英语阅读练习，非官方考试真题。</p></section><div class="notice">💡 建议先不看中文，读完文章后回答问题。提交后才查看答案和解释。阅读简答题提供参考答案供自行核对；系统不会自动判断语义。学习进度只保存在当前浏览器。朗读使用浏览器英语语音。</div><nav class="tabs"><button class="tab active" data-view="home">📚 文章目录</button><button class="tab" data-view="clozelist">✍️ 选词填空</button><button class="tab" data-view="progress">🌱 学习记录</button></nav><div id="app"></div><footer class="footer">Practice a little every day · English Åk 6</footer></main><script>
const stories=[{"title": "The Missing Backpack", "type": "Story", "level": 2, "paras": ["On Monday morning, Emma arrived at school earlier than usual. She put her blue backpack beside a red bench outside her classroom and went to talk to her friend Olivia. They were excited about the class trip planned for Friday.", "When the bell rang, Emma returned to get her backpack. But it was gone! She looked under the benches, behind the classroom door and even in the library. Her notebook, lunch and English homework were all inside it.", "At lunchtime, Emma noticed a younger boy carrying a blue backpack that looked just like hers. Instead of shouting at him, she politely asked where he had found it. The boy looked surprised. He had taken it by mistake because his own bag was the same colour.", "They checked the bags together. Emma found her homework, and the boy found his sports clothes in the other bag. He apologised, and Emma smiled. The next day, she attached a bright yellow keyring to her backpack. She knew it would be much easier to recognise in the future."], "summary": "一个学生误拿了相似的书包，Emma冷静地找回自己的东西。", "words": [["beside", "bredvid", "在……旁边"], ["noticed", "märkte", "注意到"], ["politely", "artigt", "礼貌地"], ["by mistake", "av misstag", "错误地；不小心"], ["recognise", "känna igen", "认出"]], "questions": [["Where did Emma leave her backpack?", ["In the library", "Beside a red bench", "On the school bus"], 1, "The first paragraph tells us where she left it."], ["Why was Emma worried?", ["Her belongings were in the bag", "She missed the trip", "Olivia was angry"], 0, "Her homework, notebook and lunch were inside."], ["Who had Emma’s backpack?", ["A younger boy", "Her teacher", "Olivia"], 0, "The boy took it by mistake."], ["How did Emma speak to the boy?", ["Rudely", "Politely", "Angrily"], 1, "She asked him politely."], ["Why did the boy take the wrong bag?", ["He wanted Emma’s lunch", "The bags looked similar", "He was playing a joke"], 1, "Both bags were blue."], ["What does the yellow keyring help Emma do?", ["Carry more books", "Recognise her bag", "Open the classroom"], 1, "It makes her bag easier to recognise."]], "tf": [["Emma found her backpack in the library.", false], ["The boy apologised.", true]], "short": [["What was Emma looking forward to on Friday?", "the class trip"], ["What did Emma put on her backpack?", "a bright yellow keyring"]]}, {"title": "A Weekend Without Screens", "type": "Everyday life", "level": 2, "paras": ["Leo loved playing games on his tablet. After school, he often spent hours watching videos or messaging his friends. One Friday, his parents suggested a family challenge: no phones, tablets or computers for the whole weekend.", "At first, Leo thought the idea was terrible. On Saturday morning, he kept reaching for his tablet, forgetting that it was locked away. His younger sister Maya suggested building a model town from cardboard boxes. Leo did not want to help, but he eventually agreed.", "Soon the living room floor was covered with roads, bridges and tiny paper houses. In the afternoon, the family went for a walk in the woods. They spotted a deer and took turns describing what they could hear. Leo was surprised by how many different birds were singing.", "On Sunday, Leo baked bread with his dad and played a board game with Maya. By Sunday evening, he missed his online friends, but he also felt proud. He had discovered that a weekend could be interesting without a screen. The family decided to try one screen-free afternoon every month."], "summary": "Leo尝试周末不使用电子屏幕，发现了新的乐趣。", "words": [["suggested", "föreslog", "建议"], ["challenge", "utmaning", "挑战"], ["eventually", "till slut", "最终"], ["spotted", "fick syn på", "发现；看见"], ["discovered", "upptäckte", "发现"]], "questions": [["What was the family challenge?", ["No screens for the weekend", "No homework", "No outdoor activities"], 0, "They put away phones, tablets and computers."], ["How did Leo feel at first?", ["Excited", "Unhappy", "Proud"], 1, "He thought the idea was terrible."], ["What did Maya suggest?", ["Making a model town", "Going swimming", "Watching a film"], 0, "They used cardboard boxes."], ["What did the family see in the woods?", ["A fox", "A deer", "A bear"], 1, "They spotted a deer."], ["What did Leo do with his dad?", ["Built a bridge", "Baked bread", "Played football"], 1, "They baked bread on Sunday."], ["What did the family decide at the end?", ["Never use screens again", "Have a screen-free afternoon monthly", "Sell the tablet"], 1, "One afternoon every month."]], "tf": [["Leo enjoyed the idea from the beginning.", false], ["The family went into the woods.", true]], "short": [["What did Leo and Maya build?", "a model town"], ["Name one thing Leo learned about weekends.", "they can be interesting without screens"]]}, {"title": "The Dolphin Rescue", "type": "Environment", "level": 3, "paras": ["Twelve-year-old Nia was walking along the beach with her grandfather when she heard an unusual sound. Near some rocks, a young dolphin was trapped in shallow water. A piece of fishing line was wrapped around its tail.", "Nia wanted to run into the sea immediately, but her grandfather stopped her. A frightened wild animal could be dangerous, and they did not know how badly it was hurt. Instead, they called a local marine rescue centre and explained exactly where they were.", "While they waited, Nia watched the dolphin from a safe distance. She noticed that it could still breathe, but it was struggling to swim. The rescue team arrived with special equipment. One worker carefully removed the fishing line while another checked the dolphin for injuries.", "After some time, the team helped the dolphin back into deeper water. It swam slowly at first and then disappeared beneath the waves. Nia felt relieved. The next week, she helped organise a beach clean-up at school. She wanted other children to understand that rubbish and lost fishing equipment can harm sea animals."], "summary": "Nia发现受困海豚，并通过联系专业救援人员帮助它。", "words": [["trapped", "fast", "被困的"], ["shallow", "grunt", "浅的"], ["struggling", "kämpade", "挣扎"], ["equipment", "utrustning", "设备"], ["harm", "skada", "伤害"]], "questions": [["What was wrapped around the dolphin’s tail?", ["Seaweed", "Fishing line", "A plastic bag"], 1, "The text says fishing line."], ["Why did the grandfather stop Nia?", ["He did not like dolphins", "Helping alone could be unsafe", "The tide was too high"], 1, "Wild animals may be dangerous when frightened."], ["Who did they call?", ["A marine rescue centre", "The school", "A fishing shop"], 0, "They contacted trained rescuers."], ["What did Nia notice while waiting?", ["The dolphin could still breathe", "The dolphin was sleeping", "The dolphin had gone"], 0, "It could breathe but struggled to swim."], ["How did the dolphin leave?", ["In a truck", "By swimming into deeper water", "On a boat"], 1, "The team helped it reach deeper water."], ["Why did Nia organise a clean-up?", ["To find shells", "To protect sea animals", "To win a prize"], 1, "She wanted to reduce dangerous rubbish."]], "tf": [["Nia rescued the dolphin entirely by herself.", false], ["The rescue team used special equipment.", true]], "short": [["Where was the dolphin trapped?", "in shallow water near rocks"], ["What did Nia organise at school?", "a beach clean-up"]]}, {"title": "Life in the Year 2050", "type": "Information", "level": 3, "paras": ["What might everyday life look like in 2050? Nobody knows for certain, but scientists and engineers are already developing ideas that could change our homes, schools and cities.", "In some cities, buses may run on electricity and use computers to help drivers avoid accidents. More buildings could have gardens on their roofs, giving insects places to live and helping keep streets cooler during hot summers. Some families might even grow vegetables indoors.", "Schools may also change. Students could use virtual reality to explore ancient cities or visit the ocean without leaving their classrooms. However, teachers will still be important. A computer can provide information, but students also need people who listen, explain and encourage them.", "Not every new invention will solve a problem. Electronic devices require energy and materials, and not everyone can afford the newest technology. People will have to make careful decisions about what is useful and fair. The future will depend not only on what we invent, but also on how we choose to use it."], "summary": "一篇关于2050年交通、学校与环保技术的预测性说明文。", "words": [["developing", "utvecklar", "正在研发"], ["avoid", "undvika", "避免"], ["ancient", "gammal; forntida", "古代的"], ["afford", "ha råd med", "负担得起"], ["depend on", "bero på", "取决于"]], "questions": [["Does the writer know exactly what 2050 will be like?", ["Yes", "No", "Only for schools"], 1, "The first paragraph says nobody knows for certain."], ["What might help keep streets cooler?", ["Roof gardens", "More cars", "Tall fences"], 0, "Roof gardens may help."], ["How could students explore ancient cities?", ["With virtual reality", "By reading only", "With electric buses"], 0, "The text mentions virtual reality."], ["Why will teachers still matter?", ["They can listen and explain", "Computers will disappear", "Schools will have no books"], 0, "Students need human support."], ["What is one problem with new devices?", ["They need energy and materials", "They never work", "They cannot show pictures"], 0, "New technology uses resources."], ["What is the main message?", ["Every invention is good", "The future depends on our choices", "All schools will close"], 1, "How we use inventions matters."]], "tf": [["The text makes predictions, not promises.", true], ["Everyone can afford the newest technology.", false]], "short": [["Give one possible use of virtual reality in schools.", "exploring ancient cities"], ["Why should people think carefully about inventions?", "they use resources and should be useful and fair"]]}, {"title": "A School Trip Gone Wrong", "type": "Adventure", "level": 4, "paras": ["The class had been looking forward to their trip to the nature reserve for weeks. Their teacher, Mr Brown, had planned a walk, a picnic and a short lesson about local wildlife. Before leaving, he reminded everyone to stay with a partner and follow the marked path.", "After lunch, Ella and Sam stopped to photograph a colourful butterfly. When they looked up, the rest of the class had disappeared around a bend. They hurried forward, but at the next crossing there were two paths and no sign of their classmates.", "Sam wanted to choose the path on the left. Ella disagreed. She remembered Mr Brown’s instructions: if you get separated, stop somewhere safe and contact an adult. They stayed near a wooden information board and called their teacher. The phone signal was weak, but their message finally went through.", "While they waited, rain began to fall. Sam grew impatient, but Ella suggested reading the map on the information board. It showed that they were close to the visitor centre. A few minutes later, Mr Brown arrived with a park ranger. He was relieved that they had stayed in one place.", "Back on the bus, Sam admitted that rushing along an unknown path could have made things worse. Ella agreed. They had missed part of the walk, but they had learned something more important than the names of trees: staying calm can help you make a better decision."], "summary": "两名学生在自然保护区与班级走散，通过冷静应对安全返回。", "words": [["reserve", "naturreservat", "保护区"], ["marked path", "markerad stig", "标记的小路"], ["separated", "åtskilda", "分开的"], ["impatient", "otålig", "不耐烦的"], ["admitted", "erkände", "承认"]], "questions": [["Why did Ella and Sam stop?", ["To take a photo", "To eat lunch", "To meet a ranger"], 0, "They photographed a butterfly."], ["What problem did they face at the crossing?", ["Two paths and no classmates", "A broken bridge", "A closed gate"], 0, "They did not know which path to take."], ["What did Mr Brown tell pupils to do if separated?", ["Run faster", "Stop safely and contact an adult", "Walk to the road"], 1, "Ella remembered the safety instructions."], ["Why was contacting the teacher difficult?", ["They lost the phone", "The signal was weak", "They forgot his number"], 1, "Their message eventually went through."], ["Who came with Mr Brown?", ["A police officer", "A park ranger", "A bus driver"], 1, "He arrived with a park ranger."], ["What did Sam learn?", ["Rushing could make things worse", "Maps are always wrong", "Never take photographs"], 0, "He realised that rushing was risky."]], "tf": [["Ella and Sam decided to stay near an information board.", true], ["Mr Brown was angry because they waited.", false]], "short": [["What did Ella suggest doing while they waited?", "reading the map"], ["What is the main lesson of the story?", "staying calm helps you make better decisions"]]}];const clozes=[{"title": "A Strange Morning", "text": "Yesterday I {0} up late because my alarm did not ring. I ran {1} the kitchen and quickly ate breakfast. There was no milk, {2} I drank water instead. When I arrived at school, the lesson had already {3}. My teacher smiled and said, “You are late, {4} you have not missed the test.” I felt very {5}.", "items": [["wake", "woke", "woken"], ["into", "on", "at"], ["so", "because", "although"], ["begin", "began", "begun"], ["but", "or", "if"], ["relieved", "relieving", "relieve"]], "answers": [1, 0, 0, 2, 0, 0], "why": ["Yesterday → past tense: woke.", "Run into = 跑进。", "So expresses a result.", "Had + past participle: begun.", "But shows contrast.", "Feel + adjective: relieved."]}, {"title": "The Library Challenge", "text": "Mia loves reading, but she used to find long books {0}. One day, the librarian {1} her to choose a mystery story. Mia read a few pages {2} evening. After a week, she was so interested {3} she did not want to stop. She learned that reading becomes easier {4} you practise regularly. Now she is looking {5} to her next book.", "items": [["difficult", "difficulty", "differ"], ["encourage", "encouraged", "encouraging"], ["every", "all", "each of"], ["that", "than", "because"], ["if", "unless", "although"], ["forward", "after", "up"]], "answers": [0, 1, 0, 0, 0, 0], "why": ["Find something + adjective.", "Past tense: encouraged.", "Every evening = 每天晚上。", "So ... that ... structure.", "If introduces a condition.", "Look forward to = 期待。"]}, {"title": "The Rainy Match", "text": "Our football team was ready for the final match when dark clouds {0} above the field. It started raining {1}, and the referee asked everyone to wait. We were disappointed, {2} nobody wanted to give up. After twenty minutes, the rain stopped and the game {3}. We played carefully because the grass was {4}. In the end, we lost by one goal, but we were proud {5} our teamwork.", "items": [["appeared", "appear", "appearing"], ["heavy", "heavily", "heavier"], ["but", "because", "so"], ["continued", "continuing", "continue"], ["slippery", "slip", "slipped"], ["of", "for", "with"]], "answers": [0, 1, 0, 0, 0, 0], "why": ["Past tense: appeared.", "Adverb describes raining: heavily.", "Contrast: but.", "Past tense: continued.", "Adjective after was: slippery.", "Proud of = 为……自豪。"]}];
const app=document.getElementById('app');const key='beibei-reading-ak6-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{};state.reading=state.reading||{};state.cloze=state.cloze||{};let current='home';
function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function say(s,rate=.85){if(!window.speechSynthesis){alert('浏览器不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=rate;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase()==='en-gb');if(v)u.voice=v;speechSynthesis.speak(u)}function btn(t,fn,cl='btn'){let b=document.createElement('button');b.className=cl;b.textContent=t;b.onclick=fn;return b}function elem(tag,cls,html){let x=document.createElement(tag);if(cls)x.className=cls;if(html!==undefined)x.innerHTML=html;return x}function switchTab(v){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));current=v;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>switchTab(x.dataset.view));
function render(){app.replaceChildren();if(current==='home')home();else if(current==='clozelist')clozelist();else if(current==='progress')progress();else if(current.startsWith('r'))reading(+current.slice(1));else if(current.startsWith('c'))cloze(+current.slice(1))}
function home(){let g=elem('div','cards');stories.forEach((s,i)=>{let d=elem('div','card',`<span class="pill">Reading ${i+1} · Level ${s.level}/4</span><h3>${esc(s.title)}</h3><div class="muted">${esc(s.type)} · ${s.paras.join(' ').split(/\s+/).length} words</div><p class="muted">${esc(s.summary)}</p><div class="small">${state.reading[i]?.finished?'✓ 已完成':'未完成'} · 6选择 + 2判断 + 2简答</div>`);d.append(btn('开始阅读 →',()=>{current='r'+i;render();window.scrollTo(0,0)},'btn primary'));g.append(d)});app.append(g)}
function clozelist(){let g=elem('div','cards');clozes.forEach((c,i)=>{let d=elem('div','card',`<span class="pill">Word Choice ${i+1}</span><h3>${esc(c.title)}</h3><p class="muted">6道选词填空 · 语法与上下文</p><div class="small">${state.cloze[i]?.finished?'✓ 已完成':'未完成'}</div>`);d.append(btn('开始练习 →',()=>{current='c'+i;render();window.scrollTo(0,0)},'btn primary'));g.append(d)});app.append(g)}
function reading(i){let s=stories[i], saved=state.reading[i]||{}, answers=saved.answers||{}, submitted=false;let head=elem('div','panel',`<span class="pill">Reading ${i+1} · ${esc(s.type)}</span><h2>${esc(s.title)}</h2><p class="muted">先阅读英文，再完成下面的题目。不要急着看翻译。</p>`);head.append(btn('← 返回目录',()=>switchTab('home')));let tools=elem('div','toolbar');tools.append(btn('🔊 听全文',()=>say(s.paras.join(' '))),btn('🐢 慢速朗读',()=>say(s.paras.join(' '),.68)));let trans=elem('div','translation hide',`<b>中文内容提示</b><p>${esc(s.summary)}</p><span class="small">这是文章大意提示，不是逐句翻译。</span>`);tools.append(btn('显示 / 隐藏中文提示',()=>trans.classList.toggle('hide')));head.append(tools);let text=elem('div','reading');s.paras.forEach(p=>{let para=elem('p','');para.textContent=p;text.append(para)});head.append(text,trans);app.append(head);
let w=elem('section','panel section','<h3>🔎 Useful Words · 词汇提示</h3>');s.words.forEach(([en,sv,zh])=>{let row=elem('div','word',`<div><strong>${esc(en)}</strong><div class="muted">🇸🇪 ${esc(sv)} · 🇨🇳 ${esc(zh)}</div></div>`);row.append(btn('🔊',()=>say(en)));w.append(row)});app.append(w);
let qpanel=elem('section','panel section','<h2>📝 Reading Questions</h2><p class="muted">Part A: Choose the best answer. Part B: True / False. Part C: Answer in English.</p>');let controls=[];
function radioQuestion(label,opts,correct,explanation,idx){let d=elem('div','q',`<b>${esc(label)}</b>`);let optsDiv=elem('div','options');let inputs=[];opts.forEach((o,j)=>{let lab=elem('label','option');let inp=document.createElement('input');inp.type='radio';inp.name='q'+i+'-'+idx;inp.value=j;if(answers[idx]===j)inp.checked=true;inp.onchange=()=>{answers[idx]=j;state.reading[i]={...saved,answers};save()};lab.append(inp,document.createTextNode(' '+o));optsDiv.append(lab);inputs.push(inp)});d.append(optsDiv);let f=elem('div','feedback');d.append(f);qpanel.append(d);controls.push(()=>{let selected=inputs.findIndex(x=>x.checked);let ok=selected===correct;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ Correct!':'✗ Correct: '+opts[correct]+'.')+' '+explanation;return ok})}
s.questions.forEach((q,j)=>radioQuestion('A'+(j+1)+'. '+q[0],q[1],q[2],q[3],'a'+j));s.tf.forEach((q,j)=>radioQuestion('B'+(j+1)+'. '+q[0],['True','False'],q[1]?0:1,'Check the information in the story.','b'+j));let shortChecks=[];s.short.forEach((q,j)=>{let d=elem('div','q',`<b>C${j+1}. ${esc(q[0])}</b>`);let t=elem('textarea','textinput');t.placeholder='Write your answer in English...';t.value=answers['s'+j]||'';t.oninput=()=>{answers['s'+j]=t.value;state.reading[i]={...saved,answers};save()};let f=elem('div','feedback hide',`<b>参考答案：</b> ${esc(q[1])}<br><span class="small">简答题请自己对照意思检查，不进行自动评分。</span>`);d.append(t,f);qpanel.append(d);shortChecks.push(()=>f.classList.remove('hide'))});let result=elem('div','result');qpanel.append(btn('✓ 提交并查看答案',()=>{let answered=Object.keys(answers).filter(k=>k.startsWith('a')||k.startsWith('b')).length;if(answered<8){result.textContent='请先完成8道选择与判断题（目前 '+answered+'/8）。';return}let score=controls.reduce((a,f)=>a+Number(f()),0);shortChecks.forEach(f=>f());result.textContent='自动批改：'+score+'/8 · 简答题请对照参考答案。';state.reading[i]={answers,finished:true,score};save()},'btn primary'),result);app.append(qpanel)}
function cloze(i){let c=clozes[i],old=state.cloze[i]||{},values=old.values||{},panel=elem('section','panel',`<span class="pill">Word Choice ${i+1}</span><h2>✍️ ${esc(c.title)}</h2><p class="muted">Read the whole text. Choose the best word for each gap, then check your answers.</p>`);panel.append(btn('← 返回选词目录',()=>switchTab('clozelist')));let passage=elem('div','cloze section');let selects=[];c.text.split(/\{(\d+)\}/).forEach((part,k)=>{if(k%2===0){passage.append(document.createTextNode(part));return}let n=+part;let select=document.createElement('select');select.setAttribute('aria-label','Gap '+(n+1));select.append(new Option('('+ (n+1) +') Choose...',''));c.items[n].forEach((v,j)=>select.append(new Option(v,String(j))));select.value=values[n]===undefined?'':String(values[n]);select.onchange=()=>{values[n]=select.value===''?undefined:+select.value;state.cloze[i]={...old,values};save()};selects[n]=select;passage.append(select)});panel.append(passage);let feedback=elem('div','section');let result=elem('div','result');panel.append(btn('✓ 提交并检查',()=>{if(selects.some(s=>s.value==='')){result.textContent='请先完成全部6个空格。';return}let score=0;feedback.replaceChildren();selects.forEach((s,n)=>{let ok=+s.value===c.answers[n];score+=Number(ok);let d=elem('div','answer '+(ok?'good':'bad'),`${ok?'✓':'✗'} Gap ${n+1}: <b>${esc(c.items[n][c.answers[n]])}</b> — ${esc(c.why[n])}`);feedback.append(d)});result.textContent='得分：'+score+'/6';state.cloze[i]={values,finished:true,score};save()},'btn primary'),result,feedback);app.append(panel)}
function progress(){let n=stories.filter((_,i)=>state.reading[i]?.finished).length,m=clozes.filter((_,i)=>state.cloze[i]?.finished).length;let panel=elem('section','panel',`<h2>🌱 学习进度</h2><p class="muted">已完成 ${n}/5 篇阅读，${m}/3 篇选词填空。进度保存在此浏览器，清理浏览器数据可能丢失。</p><div class="bar"><div class="fill" style="width:${(n+m)/8*100}%"></div></div><h3>已完成的练习</h3>`);stories.forEach((s,i)=>panel.append(elem('p','muted',(state.reading[i]?.finished?'✓ ':'○ ')+s.title+(state.reading[i]?.finished?' — '+state.reading[i].score+'/8':''))));clozes.forEach((c,i)=>panel.append(elem('p','muted',(state.cloze[i]?.finished?'✓ ':'○ ')+c.title+(state.cloze[i]?.finished?' — '+state.cloze[i].score+'/6':''))));app.append(panel)}render();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科学 第40周｜我的学习小天地</title><link rel="stylesheet" href="../assets/style.css"><style>:root{--accent:#e99a24}</style></head><body><header class="top"><div class="brand">🔬 科学 · 第40周</div><a class="back" href="index.html">← 返回科学目录</a></header><main class="wrap"><div class="head" style="margin-top:0"><div><h2>第40周学习</h2><p>区分原子、分子和由不同元素组成的化合物。</p></div><span class="pill">WEEK 40</span></div><section class="panel"><h1 class="lesson-title">物质与粒子</h1><p class="lead">区分原子、分子和由不同元素组成的化合物。</p><div class="items"><div class="item"><span class="emo">⚛️</span><div><strong>原子</strong><span>构成物质的基本粒子之一。</span></div></div><div class="item"><span class="emo">🔵</span><div><strong>分子</strong><span>由两个或更多原子结合形成，例如 O₂。</span></div></div><div class="item"><span class="emo">💧</span><div><strong>化合物</strong><span>由不同元素的原子组成，例如水 H₂O。</span></div></div><div class="item"><span class="emo">🧪</span><div><strong>观察</strong><span>水分子由氢原子和氧原子组成。</span></div></div></div><div class="tip">💡 <strong>学习提示：</strong>O₂ 只含氧元素；H₂O 同时含氢和氧两种元素。</div><div class="quiz"><h2>✏️ 本周小练习</h2><p><strong>水（H₂O）属于什么？</strong></p><label class="option"><input type="radio" name="q" value="0"> 只由氧组成的分子</label><label class="option"><input type="radio" name="q" value="1"> 由不同元素组成的化合物</label><label class="option"><input type="radio" name="q" value="2"> 单独一个原子</label><button class="primary" id="check">检查答案</button><button class="secondary" id="again">重新作答</button><span class="feedback" id="fb"></span><div class="tip answer hidden" id="answer"></div></div><div class="complete"><span id="doneText">完成学习和练习后，可以标记本周完成。</span><button id="done">✓ 标记完成</button></div></section></main><footer>🌱 第40周 · 科学</footer><script>
const KEY="kids-learning-progress",page="science-40",correct=1;let p=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"scores":{}}');
function refresh(){let d=p.done.includes(page);done.textContent=d?"✓ 已完成（点击取消）":"✓ 标记完成";doneText.textContent=d?"太棒了！第40周科学已经完成，可以随时回来复习。":"完成学习和练习后，可以标记本周完成。"}
check.onclick=()=>{let a=document.querySelector('input[name=q]:checked');if(!a){fb.textContent="请先选择一个答案。";return}let ok=+a.value===correct;p.scores[page]=ok?100:0;localStorage.setItem(KEY,JSON.stringify(p));fb.textContent=ok?"回答正确！🎉":"再想一想，看看解析。";answer.classList.remove("hidden");answer.innerHTML="💡 <strong>答案解析：</strong>水含有氢和氧两种元素，因此是化合物。"};
again.onclick=()=>{document.querySelectorAll('input[name=q]').forEach(x=>x.checked=false);fb.textContent="";answer.classList.add("hidden")};
done.onclick=()=>{if(p.done.includes(page))p.done=p.done.filter(x=>x!==page);else p.done.push(page);localStorage.setItem(KEY,JSON.stringify(p));refresh()};refresh();
</script></body></html>

</style></head><body><header><div class="wrap"><div class="top"><div class="eyebrow">MATEMATIK · ÅRSKURS 1–6</div><a class="back" href="index.html" title="返回上一级目录的 index.html">← 返回数学主页</a></div><h1>瑞典小学数学术语词典</h1><p>Matematikord på svenska och kinesiska · 从基础数字到六年级的几何、代数、分数和应用题。每个词都有中文解释、瑞典语例句和中文翻译。</p><div class="hero-badges"><span id="total"></span><span>📖 双语例句</span><span>🔊 瑞典语朗读</span><span>☆ 收藏难词</span></div></div></header><main class="wrap"><div class="tools"><div class="searchrow"><label class="sr" for="q">搜索术语</label><input autocomplete="off" class="search" id="q" placeholder="搜索瑞典语、中文或例句，例如 faktor、分母、面积……" type="search"/><button aria-pressed="false" class="btn" id="favorites">☆ 只看收藏</button><button class="btn" id="clear">清除筛选</button></div><div aria-label="知识领域" class="chips" id="chips"></div></div><div class="status"><span aria-live="polite" id="count"></span><span>点击 🔊 听瑞典语</span></div><div class="notice">💡 瑞典小数通常使用逗号：例如 3,5 = 中文的 3.5。部分术语跨越多个年级，网页按知识领域分类，不代表每个术语都必须在六年级掌握。</div><section aria-label="数学术语卡片" class="cards" id="cards"></section><div class="footer">适合家庭学习与数学题阅读 · Åk 1–6 · 所有内容可离线浏览（朗读取决于设备语音支持）</div></main><script>
const DATA=[{"cat": "数字与数的认识", "sv": "tal", "zh": "数", "desc": "用于表示数量或大小的数学对象。", "ex": "Talet 24 är ett jämnt tal.", "trans": "24是一个偶数。"}, {"cat": "数字与数的认识", "sv": "siffra", "zh": "数字符号", "desc": "0到9这十个书写符号。", "ex": "Talet 248 består av tre siffror.", "trans": "248由三个数字符号组成。"}, {"cat": "数字与数的认识", "sv": "ental", "zh": "个位", "desc": "整数从右往左第一位。", "ex": "I talet 352 står 2 på entalsplatsen.", "trans": "在352中，2位于个位。"}, {"cat": "数字与数的认识", "sv": "tiotal", "zh": "十位", "desc": "表示几个十的数位。", "ex": "I talet 352 finns 5 tiotal.", "trans": "352的十位数字是5。"}, {"cat": "数字与数的认识", "sv": "hundratal", "zh": "百位", "desc": "表示几个百的数位。", "ex": "I talet 352 står 3 på hundratalsplatsen.", "trans": "在352中，3位于百位。"}, {"cat": "数字与数的认识", "sv": "tusental", "zh": "千位", "desc": "表示几个千的数位。", "ex": "I talet 4 321 är 4 tusental.", "trans": "4321中有4个千。"}, {"cat": "数字与数的认识", "sv": "platsvärde", "zh": "数位值", "desc": "数字所在位置决定它表示的大小。", "ex": "Siffran 6 har platsvärdet 600 i talet 625.", "trans": "625中的6表示600。"}, {"cat": "数字与数的认识", "sv": "naturliga tal", "zh": "自然数", "desc": "用于计数的数，通常包括0、1、2、3……；不同资料有时从1开始。", "ex": "0, 1, 2 och 3 är naturliga tal.", "trans": "0、1、2、3是自然数。"}, {"cat": "数字与数的认识", "sv": "heltal", "zh": "整数", "desc": "包括负整数、零和正整数。", "ex": "−3, 0 och 8 är heltal.", "trans": "−3、0和8都是整数。"}, {"cat": "数字与数的认识", "sv": "positiva tal", "zh": "正数", "desc": "大于0的数。", "ex": "7 är ett positivt tal.", "trans": "7是正数。"}, {"cat": "数字与数的认识", "sv": "negativa tal", "zh": "负数", "desc": "小于0的数。", "ex": "−5 är ett negativt tal.", "trans": "−5是负数。"}, {"cat": "数字与数的认识", "sv": "udda tal", "zh": "奇数", "desc": "不能被2整除的整数。", "ex": "15 är ett udda tal.", "trans": "15是奇数。"}, {"cat": "数字与数的认识", "sv": "jämna tal", "zh": "偶数", "desc": "能被2整除的整数。", "ex": "18 är ett jämnt tal.", "trans": "18是偶数。"}, {"cat": "数字与数的认识", "sv": "ensiffriga tal", "zh": "一位数", "desc": "只用一个数字符号表示的非负整数，通常指0–9。", "ex": "7 är ett ensiffrigt tal.", "trans": "7是一位数。"}, {"cat": "数字与数的认识", "sv": "tvåsiffriga tal", "zh": "两位数", "desc": "用两个数字符号表示的正整数。", "ex": "42 är ett tvåsiffrigt tal.", "trans": "42是两位数。"}, {"cat": "数字与数的认识", "sv": "decimaltal", "zh": "小数", "desc": "使用小数逗号表示非整数的十进制数。", "ex": "3,5 är ett decimaltal.", "trans": "3,5是一个小数。"}, {"cat": "数字与数的认识", "sv": "decimaltecken", "zh": "小数分隔符", "desc": "瑞典通常用逗号分隔整数部分与小数部分。", "ex": "I talet 2,75 är kommatecknet decimaltecken.", "trans": "2,75中的逗号是小数分隔符。"}, {"cat": "数字与数的认识", "sv": "tiondel", "zh": "十分之一", "desc": "把整体平均分成10份中的1份。", "ex": "0,1 är en tiondel.", "trans": "0,1是十分之一。"}, {"cat": "数字与数的认识", "sv": "hundradel", "zh": "百分之一", "desc": "把整体平均分成100份中的1份。", "ex": "0,01 är en hundradel.", "trans": "0,01是百分之一。"}, {"cat": "数字与数的认识", "sv": "tusendel", "zh": "千分之一", "desc": "把整体平均分成1000份中的1份。", "ex": "0,001 är en tusendel.", "trans": "0,001是千分之一。"}, {"cat": "数字与数的认识", "sv": "tallinje", "zh": "数轴", "desc": "按大小顺序表示数的一条线。", "ex": "Markera −2 på tallinjen.", "trans": "在数轴上标出−2。"}, {"cat": "数字与数的认识", "sv": "storleksordning", "zh": "大小顺序", "desc": "按照从小到大或从大到小排列。", "ex": "Skriv talen i storleksordning: 3, 8, 1.", "trans": "把3、8、1按大小顺序排列。"}, {"cat": "数字与数的认识", "sv": "avrunda", "zh": "四舍五入；取近似值", "desc": "按指定位数给出近似数。", "ex": "Avrunda 47 till närmaste tiotal: 50.", "trans": "47四舍五入到最近的十位是50。"}, {"cat": "数字与数的认识", "sv": "ungefär", "zh": "大约", "desc": "表示近似而不是精确值。", "ex": "En meter är ungefär 100 centimeter.", "trans": "一米大约是100厘米。"}, {"cat": "数字与数的认识", "sv": "uppskatta", "zh": "估算", "desc": "根据已有信息判断一个大致数值。", "ex": "Uppskatta hur många elever som finns i salen.", "trans": "估算教室里有多少学生。"}, {"cat": "数字与数的认识", "sv": "primtal", "zh": "质数", "desc": "大于1且只有1和自身两个正因数的整数。", "ex": "7 är ett primtal.", "trans": "7是质数。"}, {"cat": "数字与数的认识", "sv": "sammansatt tal", "zh": "合数", "desc": "大于1且不是质数的整数。", "ex": "12 är ett sammansatt tal.", "trans": "12是合数。"}, {"cat": "数字与数的认识", "sv": "delbar", "zh": "可整除的", "desc": "一个整数除以另一个整数，结果没有余数。", "ex": "18 är delbart med 3.", "trans": "18能被3整除。"}, {"cat": "四则运算", "sv": "addition", "zh": "加法", "desc": "把两个或多个数合起来。", "ex": "8 + 5 = 13.", "trans": "8加5等于13。"}, {"cat": "四则运算", "sv": "addera", "zh": "相加", "desc": "进行加法运算。", "ex": "Addera 12 och 7.", "trans": "把12和7相加。"}, {"cat": "四则运算", "sv": "term", "zh": "加数；项", "desc": "加减法算式中的数，也可指代数表达式中的项。", "ex": "I 4 + 9 är 4 och 9 termer.", "trans": "在4+9中，4和9是加数。"}, {"cat": "四则运算", "sv": "summa", "zh": "和", "desc": "加法计算得到的结果。", "ex": "Summan av 4 och 9 är 13.", "trans": "4与9的和是13。"}, {"cat": "四则运算", "sv": "subtraktion", "zh": "减法", "desc": "从一个数中减去另一个数。", "ex": "15 − 6 = 9.", "trans": "15减6等于9。"}, {"cat": "四则运算", "sv": "subtrahera", "zh": "相减", "desc": "进行减法运算。", "ex": "Subtrahera 6 från 15.", "trans": "从15中减去6。"}, {"cat": "四则运算", "sv": "differens", "zh": "差", "desc": "减法运算的结果。", "ex": "Differensen mellan 15 och 6 är 9.", "trans": "15与6的差是9。"}, {"cat": "四则运算", "sv": "multiplikation", "zh": "乘法", "desc": "表示相同数量的重复相加或倍数关系。", "ex": "4 · 3 = 12.", "trans": "4乘3等于12。"}, {"cat": "四则运算", "sv": "multiplicera", "zh": "相乘", "desc": "进行乘法运算。", "ex": "Multiplicera 6 med 5.", "trans": "6乘5。"}, {"cat": "四则运算", "sv": "faktor", "zh": "因数；乘数", "desc": "乘法算式中相乘的数。", "ex": "I 4 · 7 är 4 och 7 faktorer.", "trans": "在4×7中，4和7是乘数。"}, {"cat": "四则运算", "sv": "produkt", "zh": "积", "desc": "乘法计算得到的结果。", "ex": "Produkten av 4 och 7 är 28.", "trans": "4与7的积是28。"}, {"cat": "四则运算", "sv": "division", "zh": "除法", "desc": "把数量平均分组或计算包含多少组。", "ex": "20 ÷ 4 = 5.", "trans": "20除以4等于5。"}, {"cat": "四则运算", "sv": "dividera", "zh": "相除", "desc": "进行除法运算。", "ex": "Dividera 20 med 4.", "trans": "20除以4。"}, {"cat": "四则运算", "sv": "täljare (vid division)", "zh": "被除数", "desc": "在分数式除法写法中位于分数线上方的数。", "ex": "I 20/4 är 20 täljare.", "trans": "20/4中的20是分子，也表示被除数。"}, {"cat": "四则运算", "sv": "nämnare (vid division)", "zh": "除数", "desc": "在分数式除法写法中位于分数线下方的数。", "ex": "I 20/4 är 4 nämnare.", "trans": "20/4中的4是分母，也表示除数。"}, {"cat": "四则运算", "sv": "kvot", "zh": "商", "desc": "除法计算得到的结果。", "ex": "Kvoten av 20 och 4 är 5.", "trans": "20与4的商是5。"}, {"cat": "四则运算", "sv": "rest", "zh": "余数", "desc": "不能整除时剩余的部分。", "ex": "17 delat med 5 ger resten 2.", "trans": "17除以5余2。"}, {"cat": "四则运算", "sv": "räknesätt", "zh": "运算方法", "desc": "加、减、乘、除等运算类别。", "ex": "Addition är ett räknesätt.", "trans": "加法是一种运算。"}, {"cat": "四则运算", "sv": "räkneordning", "zh": "运算顺序", "desc": "先算括号，再乘除，最后加减。", "ex": "3 + 4 · 2 = 11.", "trans": "3+4×2=11。"}, {"cat": "四则运算", "sv": "parentes", "zh": "括号", "desc": "改变或明确运算顺序的符号。", "ex": "(3 + 4) · 2 = 14.", "trans": "(3+4)×2=14。"}, {"cat": "四则运算", "sv": "huvudräkning", "zh": "心算", "desc": "不依赖书面竖式直接计算。", "ex": "Räkna ut 25 + 15 i huvudet.", "trans": "心算25+15。"}, {"cat": "四则运算", "sv": "uppställning", "zh": "竖式计算", "desc": "把数字按数位排列的笔算方法。", "ex": "Räkna 248 + 176 med uppställning.", "trans": "用竖式计算248+176。"}, {"cat": "四则运算", "sv": "överslagsräkning", "zh": "估算运算", "desc": "把数取近似值后快速估算。", "ex": "198 + 301 är ungefär 500.", "trans": "198+301大约是500。"}, {"cat": "四则运算", "sv": "dubbelt", "zh": "两倍", "desc": "一个数乘2。", "ex": "Dubbelt så mycket som 6 är 12.", "trans": "6的两倍是12。"}, {"cat": "四则运算", "sv": "hälften", "zh": "一半", "desc": "一个整体平均分成两份中的一份。", "ex": "Hälften av 18 är 9.", "trans": "18的一半是9。"}, {"cat": "分数、百分数与比例", "sv": "bråk", "zh": "分数", "desc": "表示整体中的若干等份或两个数相除。", "ex": "3/4 betyder tre fjärdedelar.", "trans": "3/4表示四分之三。"}, {"cat": "分数、百分数与比例", "sv": "täljare", "zh": "分子", "desc": "分数线上方的数。", "ex": "I 3/4 är täljaren 3.", "trans": "3/4中的分子是3。"}, {"cat": "分数、百分数与比例", "sv": "nämnare", "zh": "分母", "desc": "分数线下方的数，表示整体被平均分成几份。", "ex": "I 3/4 är nämnaren 4.", "trans": "3/4中的分母是4。"}, {"cat": "分数、百分数与比例", "sv": "bråkstreck", "zh": "分数线", "desc": "分隔分子和分母，也表示除法。", "ex": "Bråkstrecket i 3/4 betyder division.", "trans": "3/4中的分数线表示除法。"}, {"cat": "分数、百分数与比例", "sv": "en halv", "zh": "二分之一", "desc": "整体平均分成两份中的一份。", "ex": "En halv pizza är 1/2 pizza.", "trans": "半个披萨是1/2个披萨。"}, {"cat": "分数、百分数与比例", "sv": "en fjärdedel", "zh": "四分之一", "desc": "整体平均分成四份中的一份。", "ex": "En fjärdedel av 20 är 5.", "trans": "20的四分之一是5。"}, {"cat": "分数、百分数与比例", "sv": "blandad form", "zh": "带分数", "desc": "整数与真分数共同表示的形式。", "ex": "1 1/2 är skrivet i blandad form.", "trans": "1又1/2是带分数。"}, {"cat": "分数、百分数与比例", "sv": "bråkform", "zh": "分数形式", "desc": "用分子和分母表示数。", "ex": "0,5 kan skrivas som 1/2 i bråkform.", "trans": "0,5可写成分数1/2。"}, {"cat": "分数、百分数与比例", "sv": "decimalform", "zh": "小数形式", "desc": "用十进制小数表示数。", "ex": "1/4 är 0,25 i decimalform.", "trans": "1/4写成小数是0,25。"}, {"cat": "分数、百分数与比例", "sv": "förkorta bråk", "zh": "约分", "desc": "分子分母同时除以相同的非零整数。", "ex": "Förkorta 2/4 till 1/2.", "trans": "把2/4约分成1/2。"}, {"cat": "分数、百分数与比例", "sv": "förlänga bråk", "zh": "扩分", "desc": "分子分母同时乘相同的非零整数。", "ex": "Förläng 1/2 till 2/4.", "trans": "把1/2扩分成2/4。"}, {"cat": "分数、百分数与比例", "sv": "likvärdiga bråk", "zh": "等值分数", "desc": "表示相同数值的不同分数。", "ex": "1/2 och 2/4 är likvärdiga bråk.", "trans": "1/2与2/4是等值分数。"}, {"cat": "分数、百分数与比例", "sv": "procent", "zh": "百分数", "desc": "以100为基数表示比例。", "ex": "25 procent är 25 av 100.", "trans": "25%表示每100份中的25份。"}, {"cat": "分数、百分数与比例", "sv": "procenttecken", "zh": "百分号", "desc": "百分数的符号%。", "ex": "Skriv 50 procent som 50 %.", "trans": "把百分之五十写成50%。"}, {"cat": "分数、百分数与比例", "sv": "procentandel", "zh": "百分比份额", "desc": "整体中某部分所占的百分比。", "ex": "10 av 40 elever är 25 %.", "trans": "40名学生中的10名占25%。"}, {"cat": "分数、百分数与比例", "sv": "rabatt", "zh": "折扣", "desc": "商品价格降低的部分。", "ex": "En tröja för 200 kr har 20 % rabatt.", "trans": "一件200克朗的衣服打八折（优惠20%）。"}, {"cat": "分数、百分数与比例", "sv": "prishöjning", "zh": "涨价", "desc": "价格上升。", "ex": "Priset höjs från 100 kr till 110 kr.", "trans": "价格从100克朗涨到110克朗。"}, {"cat": "分数、百分数与比例", "sv": "prissänkning", "zh": "降价", "desc": "价格下降。", "ex": "Priset sänks från 100 kr till 80 kr.", "trans": "价格从100克朗降到80克朗。"}, {"cat": "分数、百分数与比例", "sv": "andel", "zh": "部分；份额", "desc": "整体中所占的部分。", "ex": "Tre av tolv elever är en fjärdedel.", "trans": "12名学生中的3名占四分之一。"}, {"cat": "分数、百分数与比例", "sv": "förhållande", "zh": "比；数量关系", "desc": "两个数量之间的比较。", "ex": "Förhållandet mellan röda och blå kulor är 2:3.", "trans": "红球与蓝球的数量比是2:3。"}, {"cat": "分数、百分数与比例", "sv": "proportion", "zh": "比例关系", "desc": "两个比相等的关系。", "ex": "2/3 = 4/6 är en proportion.", "trans": "2/3=4/6是一个比例关系。"}, {"cat": "分数、百分数与比例", "sv": "proportionell", "zh": "成正比例的", "desc": "一个量乘某倍数，另一个量也乘相同倍数。", "ex": "Om ett äpple kostar 5 kr kostar tre 15 kr.", "trans": "一个苹果5克朗，三个15克朗，价格与数量成正比例。"}, {"cat": "分数、百分数与比例", "sv": "skala", "zh": "比例尺", "desc": "图上长度与实际长度之间的比。", "ex": "Skala 1:100 betyder att 1 cm motsvarar 100 cm.", "trans": "1:100表示图上1厘米相当于实际100厘米。"}, {"cat": "代数与规律", "sv": "algebra", "zh": "代数", "desc": "用字母、符号和关系研究数量与规律。", "ex": "I algebra kan x stå för ett okänt tal.", "trans": "在代数中，x可以代表未知数。"}, {"cat": "代数与规律", "sv": "variabel", "zh": "变量", "desc": "可代表不同数值的字母或符号。", "ex": "I y = x + 2 är x en variabel.", "trans": "在y=x+2中，x是一个变量。"}, {"cat": "代数与规律", "sv": "obekant tal", "zh": "未知数", "desc": "需要求出的数。", "ex": "x + 5 = 12, så x = 7.", "trans": "x+5=12，所以x=7。"}, {"cat": "代数与规律", "sv": "uttryck", "zh": "表达式", "desc": "由数字、运算符或字母组成，没有等号的数学式子。", "ex": "3x + 2 är ett uttryck.", "trans": "3x+2是一个表达式。"}, {"cat": "代数与规律", "sv": "ekvation", "zh": "方程", "desc": "含有未知数的等式。", "ex": "x + 4 = 10 är en ekvation.", "trans": "x+4=10是方程。"}, {"cat": "代数与规律", "sv": "likhet", "zh": "等式；相等关系", "desc": "等号两边的值相同。", "ex": "6 + 2 = 4 + 4 är en likhet.", "trans": "6+2=4+4是等式。"}, {"cat": "代数与规律", "sv": "likhetstecken", "zh": "等号", "desc": "表示左右两边相等的符号。", "ex": "5 + 3 = 8.", "trans": "5+3=8。"}, {"cat": "代数与规律", "sv": "olikhet", "zh": "不等式；不相等关系", "desc": "用大小符号表示两个量的关系。", "ex": "7 > 4 är en olikhet.", "trans": "7>4是不等关系。"}, {"cat": "代数与规律", "sv": "större än", "zh": "大于", "desc": "左边的数比右边大。", "ex": "9 > 6: nio är större än sex.", "trans": "9>6：9大于6。"}, {"cat": "代数与规律", "sv": "mindre än", "zh": "小于", "desc": "左边的数比右边小。", "ex": "3 < 8: tre är mindre än åtta.", "trans": "3<8：3小于8。"}, {"cat": "代数与规律", "sv": "talserie", "zh": "数列", "desc": "按照某种规律排列的一串数。", "ex": "2, 4, 6, 8 är en talserie.", "trans": "2、4、6、8是一个数列。"}, {"cat": "代数与规律", "sv": "mönster", "zh": "规律；图案模式", "desc": "不断重复或按照规则变化的结构。", "ex": "Mönstret ökar med tre varje gång.", "trans": "这个规律是每次增加3。"}, {"cat": "代数与规律", "sv": "regel", "zh": "规则", "desc": "描述变化或计算方式的方法。", "ex": "Regeln är att multiplicera med två.", "trans": "规则是乘以2。"}, {"cat": "代数与规律", "sv": "formel", "zh": "公式", "desc": "用数学符号表达的一般关系。", "ex": "Rektangelns area är A = l · b.", "trans": "长方形面积公式为A=长×宽。"}, {"cat": "几何与测量", "sv": "geometri", "zh": "几何", "desc": "研究形状、位置、大小和空间关系。", "ex": "Vi lär oss om vinklar i geometri.", "trans": "我们在几何中学习角。"}, {"cat": "几何与测量", "sv": "punkt", "zh": "点", "desc": "表示位置，不具有长度和宽度。", "ex": "Markera punkten A.", "trans": "标出A点。"}, {"cat": "几何与测量", "sv": "linje", "zh": "直线", "desc": "向两个方向无限延伸的线。", "ex": "Rita en rak linje.", "trans": "画一条直线。"}, {"cat": "几何与测量", "sv": "sträcka", "zh": "线段", "desc": "有两个端点的直线部分。", "ex": "Sträckan AB är 5 cm lång.", "trans": "线段AB长5厘米。"}, {"cat": "几何与测量", "sv": "parallella linjer", "zh": "平行线", "desc": "位于同一平面内且永不相交的直线。", "ex": "Två räls är parallella.", "trans": "两条铁轨是平行的。"}, {"cat": "几何与测量", "sv": "vinkel", "zh": "角", "desc": "两条射线从同一点出发形成的图形。", "ex": "En rät vinkel är 90 grader.", "trans": "直角是90度。"}, {"cat": "几何与测量", "sv": "rät vinkel", "zh": "直角", "desc": "大小为90°的角。", "ex": "Hörnet på ett papper är ofta en rät vinkel.", "trans": "纸张的角通常是直角。"}, {"cat": "几何与测量", "sv": "spetsig vinkel", "zh": "锐角", "desc": "大于0°且小于90°的角。", "ex": "45° är en spetsig vinkel.", "trans": "45°是锐角。"}, {"cat": "几何与测量", "sv": "trubbig vinkel", "zh": "钝角", "desc": "大于90°且小于180°的角。", "ex": "120° är en trubbig vinkel.", "trans": "120°是钝角。"}, {"cat": "几何与测量", "sv": "grad", "zh": "度", "desc": "测量角度的单位。", "ex": "Ett helt varv är 360 grader.", "trans": "转一整圈是360度。"}, {"cat": "几何与测量", "sv": "triangel", "zh": "三角形", "desc": "由三条线段围成的平面图形。", "ex": "En triangel har tre hörn.", "trans": "三角形有三个顶点。"}, {"cat": "几何与测量", "sv": "liksidig triangel", "zh": "等边三角形", "desc": "三条边长度相等的三角形。", "ex": "En liksidig triangel har tre lika långa sidor.", "trans": "等边三角形有三条等长的边。"}, {"cat": "几何与测量", "sv": "likbent triangel", "zh": "等腰三角形", "desc": "至少有两条边等长的三角形。", "ex": "En likbent triangel har minst två lika långa sidor.", "trans": "等腰三角形至少有两条等长边。"}, {"cat": "几何与测量", "sv": "fyrhörning", "zh": "四边形", "desc": "由四条边围成的平面图形。", "ex": "En rektangel är en fyrhörning.", "trans": "长方形是四边形。"}, {"cat": "几何与测量", "sv": "kvadrat", "zh": "正方形", "desc": "四条边等长且四个角均为直角。", "ex": "En kvadrat har fyra lika långa sidor.", "trans": "正方形有四条等长边。"}, {"cat": "几何与测量", "sv": "rektangel", "zh": "长方形；矩形", "desc": "四个角均为直角的四边形。", "ex": "En rektangel kan vara 4 cm lång och 2 cm bred.", "trans": "长方形可以长4厘米、宽2厘米。"}, {"cat": "几何与测量", "sv": "cirkel", "zh": "圆", "desc": "到圆心距离相同的所有点围成的平面区域及其边界。", "ex": "Rita en cirkel med radien 3 cm.", "trans": "画一个半径3厘米的圆。"}, {"cat": "几何与测量", "sv": "radie", "zh": "半径", "desc": "圆心到圆周上一点的距离。", "ex": "Radien är hälften av diametern.", "trans": "半径是直径的一半。"}, {"cat": "几何与测量", "sv": "diameter", "zh": "直径", "desc": "通过圆心且两端在圆周上的线段长度。", "ex": "Diametern är 10 cm om radien är 5 cm.", "trans": "半径5厘米时直径是10厘米。"}, {"cat": "几何与测量", "sv": "omkrets", "zh": "周长", "desc": "沿图形边界一圈的长度。", "ex": "En kvadrat med sidan 3 cm har omkretsen 12 cm.", "trans": "边长3厘米的正方形周长12厘米。"}, {"cat": "几何与测量", "sv": "area", "zh": "面积", "desc": "平面图形覆盖的大小。", "ex": "En rektangel som är 4 cm × 3 cm har arean 12 cm².", "trans": "4厘米×3厘米的长方形面积是12平方厘米。"}, {"cat": "几何与测量", "sv": "bas", "zh": "底边", "desc": "用于计算面积等的参考边。", "ex": "Triangelns bas är 6 cm.", "trans": "三角形的底边长6厘米。"}, {"cat": "几何与测量", "sv": "höjd", "zh": "高", "desc": "到指定底边或平面的垂直距离。", "ex": "Triangelns höjd är 4 cm.", "trans": "三角形的高是4厘米。"}, {"cat": "几何与测量", "sv": "volym", "zh": "体积", "desc": "立体图形占据空间的大小。", "ex": "En kub med sidan 2 cm har volymen 8 cm³.", "trans": "边长2厘米的正方体体积8立方厘米。"}, {"cat": "几何与测量", "sv": "kub", "zh": "正方体", "desc": "六个面都是正方形的立体图形。", "ex": "En kub har sex kvadratiska sidoytor.", "trans": "正方体有六个正方形面。"}, {"cat": "几何与测量", "sv": "rätblock", "zh": "长方体", "desc": "六个面都是矩形的立体图形。", "ex": "En skokartong är ungefär ett rätblock.", "trans": "鞋盒大致是长方体。"}, {"cat": "几何与测量" s": "每个盒子里有六个球。"}, {"cat": "应用题与数学表达", "sv": "minst", "zh": "至少", "desc": "数量不低于某个值。", "ex": "Du behöver minst fem biljetter.", "trans": "你至少需要五张票。"}, {"cat": "应用题与数学表达", "sv": "högst", "zh": "最多；至多", "desc": "数量不超过某个值。", "ex": "Du får välja högst tre saker.", "trans": "你最多可以选三件东西。"}, {"cat": "应用题与数学表达", "sv": "fler än", "zh": "比……多（可数）", "desc": "比较可数对象的数量。", "ex": "Det finns fler äpplen än päron.", "trans": "苹果比梨多。"}, {"cat": "应用题与数学表达", "sv": "färre än", "zh": "比……少（可数）", "desc": "比较可数对象的数量。", "ex": "Det finns färre päron än äpplen.", "trans": "梨比苹果少。"}, {"cat": "应用题与数学表达", "sv": "mer än", "zh": "比……多（量）", "desc": "表示数量或程度超过某个值。", "ex": "Vi behöver mer än två liter vatten.", "trans": "我们需要超过两升水。"}, {"cat": "应用题与数学表达", "sv": "mindre än", "zh": "少于；小于", "desc": "表示数量或数值小于某个值。", "ex": "Priset är mindre än 100 kr.", "trans": "价格低于100克朗。"}, {"cat": "应用题与数学表达", "sv": "ökar med", "zh": "增加了", "desc": "在原数量上加上指定的增量。", "ex": "Antalet ökar med 5.", "trans": "数量增加了5。"}, {"cat": "应用题与数学表达", "sv": "minskar med", "zh": "减少了", "desc": "从原数量中减去指定的数量。", "ex": "Antalet minskar med 3.", "trans": "数量减少了3。"}, {"cat": "应用题与数学表达", "sv": "ökar till", "zh": "增加到", "desc": "变化后的总量达到某个数。", "ex": "Priset ökar till 120 kr.", "trans": "价格增加到120克朗。"}, {"cat": "应用题与数学表达", "sv": "minskar till", "zh": "减少到", "desc": "变化后的总量达到某个数。", "ex": "Priset minskar till 80 kr.", "trans": "价格减少到80克朗。"}];
const cats=['全部',...new Set(DATA.map(x=>x.cat))];let cat='全部',onlyFav=false;let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem('matte_favorites_v1')||'[]'))}catch(e){};
const $=id=>document.getElementById(id);$('total').textContent=DATA.length+' 个数学术语';
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderChips(){$('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" data-cat="${escapeHTML(c)}" aria-pressed="${c===cat}">${escapeHTML(c)}${c==='全部'?'':` · ${DATA.filter(x=>x.cat===c).length}`}</button>`).join('')}
function render(){const q=$('q').value.trim().toLocaleLowerCase();const list=DATA.map((x,i)=>({...x,i})).filter(x=>(cat==='全部'||x.cat===cat)&&(!onlyFav||fav.has(x.sv))&&(!q||[x.sv,x.zh,x.desc,x.ex,x.trans].some(t=>t.toLocaleLowerCase().includes(q))));$('count').textContent=`显示 ${list.length} / ${DATA.length} 个术语`;$('cards').innerHTML=list.length?list.map(x=>`<article class="entry"><span class="category">${escapeHTML(x.cat)}</span><div class="upper"><div class="sv" lang="sv">${escapeHTML(x.sv)}</div><div class="actions"><button class="iconbtn" data-speak="${x.i}" title="朗读瑞典语术语与例句" aria-label="朗读 ${escapeHTML(x.sv)}">🔊</button><button class="iconbtn ${fav.has(x.sv)?'saved':''}" data-save="${x.i}" aria-pressed="${fav.has(x.sv)}" title="收藏或取消收藏">${fav.has(x.sv)?'★':'☆'}</button></div></div><div class="zh">${escapeHTML(x.zh)}</div><p class="desc">${escapeHTML(x.desc)}</p><div class="example"><div class="se" lang="sv">${escapeHTML(x.ex)}</div><div class="cn">${escapeHTML(x.trans)}</div></div></article>`).join(''):'<div class="empty">没有找到匹配的术语。试试其他关键词或清除筛选。</div>';renderChips()}
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;render()});$('q').addEventListener('input',render);$('favorites').addEventListener('click',()=>{onlyFav=!onlyFav;$('favorites').textContent=onlyFav?'★ 显示全部':'☆ 只看收藏';$('favorites').setAttribute('aria-pressed',onlyFav);render()});$('clear').addEventListener('click',()=>{$('q').value='';cat='全部';onlyFav=false;$('favorites').textContent='☆ 只看收藏';$('favorites').setAttribute('aria-pressed','false');render()});$('cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.save!==undefined){const x=DATA[+b.dataset.save];fav.has(x.sv)?fav.delete(x.sv):fav.add(x.sv);try{localStorage.setItem('matte_favorites_v1',JSON.stringify([...fav]))}catch(e){}render()}else if(b.dataset.speak!==undefined){const x=DATA[+b.dataset.speak];if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.sv+'. '+x.ex);u.lang='sv-SE';u.rate=.82;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase()==='sv-se')||voices.find(v=>v.lang.toLowerCase().startsWith('sv'));if(v)u.voice=v;speechSynthesis.speak(u)}});render();
</script></body></html>

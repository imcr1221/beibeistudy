<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学 第40周｜我的学习小天地</title><link rel="stylesheet" href="../assets/style.css"><style>:root{--accent:#8461d8}</style></head><body><header class="top"><div class="brand">➗ 数学 · 第40周</div><a class="back" href="index.html">← 返回数学目录</a></header><main class="wrap"><div class="head" style="margin-top:0"><div><h2>第40周学习</h2><p>理解常见分数、小数和百分数之间的对应关系。</p></div><span class="pill">WEEK 40</span></div><section class="panel"><h1 class="lesson-title">分数、小数与百分数</h1><p class="lead">理解常见分数、小数和百分数之间的对应关系。</p><div class="items"><div class="item"><span class="emo">🍕</span><div><strong>一半</strong><span>1/2 = 0.5 = 50%</span></div></div><div class="item"><span class="emo">🍰</span><div><strong>四分之一</strong><span>1/4 = 0.25 = 25%</span></div></div><div class="item"><span class="emo">🧮</span><div><strong>十分之三</strong><span>3/10 = 0.3 = 30%</span></div></div><div class="item"><span class="emo">💡</span><div><strong>方法</strong><span>分子 ÷ 分母，可以得到小数。</span></div></div></div><div class="tip">💡 <strong>学习提示：</strong>先把分数化成小数，再根据需要转换成百分数。</div><div class="quiz"><h2>✏️ 本周小练习</h2><p><strong>0.75 等于哪个分数？</strong></p><label class="option"><input type="radio" name="q" value="0"> 1/4</label><label class="option"><input type="radio" name="q" value="1"> 1/2</label><label class="option"><input type="radio" name="q" value="2"> 3/4</label><button class="primary" id="check">检查答案</button><button class="secondary" id="again">重新作答</button><span class="feedback" id="fb"></span><div class="tip answer hidden" id="answer"></div></div><div class="complete"><span id="doneText">完成学习和练习后，可以标记本周完成。</span><button id="done">✓ 标记完成</button></div></section></main><footer>🌱 第40周 · 数学</footer><script>
const KEY="kids-learning-progress",page="math-40",correct=2;let p=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"scores":{}}');
function refresh(){let d=p.done.includes(page);done.textContent=d?"✓ 已完成（点击取消）":"✓ 标记完成";doneText.textContent=d?"太棒了！第40周数学已经完成，可以随时回来复习。":"完成学习和练习后，可以标记本周完成。"}
check.onclick=()=>{let a=document.querySelector('input[name=q]:checked');if(!a){fb.textContent="请先选择一个答案。";return}let ok=+a.value===correct;p.scores[page]=ok?100:0;localStorage.setItem(KEY,JSON.stringify(p));fb.textContent=ok?"回答正确！🎉":"再想一想，看看解析。";answer.classList.remove("hidden");answer.innerHTML="💡 <strong>答案解析：</strong>3 ÷ 4 = 0.75，所以 0.75 = 3/4。"};
again.onclick=()=>{document.querySelectorAll('input[name=q]').forEach(x=>x.checked=false);fb.textContent="";answer.classList.add("hidden")};
done.onclick=()=>{if(p.done.includes(page))p.done=p.done.filter(x=>x!==page);else p.done.push(page);localStorage.setItem(KEY,JSON.stringify(p));refresh()};refresh();
</script></body></html>

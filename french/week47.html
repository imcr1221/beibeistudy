<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 47 · Franska 2B</title><style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#22334d;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:22px}header{background:linear-gradient(115deg,#336fbb,#6b8bd6);color:white;padding:28px;border-radius:20px}h1{margin:0 0 8px}nav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:#e5edf8;color:#174d84;font-weight:650}button.active,button.primary{background:#2468b1;color:white}button:disabled{opacity:.5;cursor:default}.panel{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 20px #1e42651a}.hide{display:none}.muted{color:#65758a}.big{font-size:clamp(25px,4vw,42px);font-weight:750;margin:30px 0}.translation{font-size:24px;color:#276b80}.center{text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}.progress{font-weight:650;color:#4a6684}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 4px;border-bottom:1px solid #e6edf4}.row .fr{font-weight:700}.row small{color:#53687f}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #e4eaf1}th{background:#edf4fc}input{width:100%;max-width:470px;border:2px solid #cbd9e8;border-radius:12px;padding:14px;font:inherit;font-size:19px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.choices button{text-align:left;min-height:66px}.correct{background:#d9f4e6!important;color:#16633c!important}.wrong{background:#ffe1e0!important;color:#9a3030!important}.feedback{min-height:40px;margin:18px 0;font-weight:700}.note{font-size:14px;color:#526980}a{color:inherit}@media(max-width:620px){.choices{grid-template-columns:1fr}.panel{padding:17px}.wrap{padding:12px}td,th{padding:9px 5px}}</style></head><body><div class="wrap"><header><h1>🇫🇷 Week 47 · Chapitre 2B</h1><div>Franska åk 6 · La brocante · 25 ord</div><div style="margin-top:10px;font-size:14px">学习单词 · 听发音 · 瑞典语翻法语 · 选择练习</div></header><nav><button class="active" data-tab="words">📚 Ordlista</button><button data-tab="cards">🃏 单词卡</button><button data-tab="choice">🎯 选择题</button><button data-tab="write">✍️ 拼写练习</button><button data-tab="mistakes">🔁 错题复习</button></nav><section class="panel" id="words"><h2>Ordlista · 单词表</h2><p class="muted">点击 🔊 听法语发音。浏览器语音取决于设备是否安装法语语音。</p><div id="wordlist"></div></section><section class="panel hide center" id="cards"><div class="progress" id="cardCount"></div><div class="big" id="cardFr"></div><div id="cardSv" class="translation" hidden></div><div class="actions"><button onclick="speak(currentCard().fr)">🔊 听发音</button><button onclick="document.getElementById('cardSv').hidden=false">显示瑞典语</button></div><div class="actions"><button onclick="stepCard(-1)">← 上一个</button><button class="primary" onclick="stepCard(1)">下一个 →</button><button onclick="shuffleCards()">🔀 打乱</button></div></section><section class="panel hide" id="choice"><div class="progress" id="choiceCount"></div><h2>选择正确的法语</h2><div class="big center" id="choiceQ"></div><div class="choices" id="choiceOptions"></div><div class="feedback" id="choiceFeedback" aria-live="polite"></div><button id="choiceNext" class="primary" onclick="nextChoice()" disabled>下一题 →</button></section><section class="panel hide" id="write"><div class="progress" id="writeCount"></div><h2>把瑞典语翻译成法语</h2><div class="big center" id="writeQ"></div><div class="center"><input id="answer" autocomplete="off" spellcheck="false" placeholder="Skriv på franska…" onkeydown="if(event.key==='Enter')checkOrNext()"><div class="actions"><button class="primary" onclick="checkOrNext()" id="writeCheck">检查答案</button><button onclick="speak(writeOrder[writePos].fr)">🔊 听正确发音</button><button onclick="showAnswer()">显示答案</button></div><div class="feedback" id="writeFeedback" aria-live="polite"></div></div></section><section class="panel hide" id="mistakes"><h2>错题本 · Mina svåra ord</h2><p class="muted">选择题或拼写错误会自动记录在此设备的浏览器中。</p><div id="mistakeList"></div><div class="actions"><button onclick="startMistakePractice()" class="primary">练习错题</button><button onclick="clearMistakes()">清空错题</button></div></section><p class="note">注：原表第18项“une table antique”的瑞典语写成“ett antikt glas”，应为“ett antikt bord”（古董桌子），这里已按正确词义呈现。</p></div><script>
const data=[['à','på'],['la brocante','loppmarknaden'],['pour','för'],['il y a','det finns'],['la voiture coûte combien ?','hur mycket kostar bilen?'],['treize euros','13 euro'],['beaucoup','mycket'],['mignon','söt'],['l’avion','flygplanet'],['cher','dyr'],['la moto','motorcykeln'],['comme','som'],['la moto de maman','mammas motorcykel'],['elle a','hon har'],['ta maman','din mamma'],['pourquoi','varför'],['un verre','ett glas'],['une table antique','ett antikt bord'],['le prix','priset'],['la lampe','lampan'],['moderne','modern'],['peut-être','kanske'],['tu rigoles','du skojar'],['le vélo parfait','den perfekta cykeln'],['déjà','redan']].map(([fr,sv],id)=>({fr,sv,id}));
let cardOrder=[...data],cardPos=0,choiceOrder=[],choicePos=0,choiceDone=false,writeOrder=[],writePos=0,writeDone=false;const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window)){alert('浏览器不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.83;speechSynthesis.speak(u)}function mistakes(){try{return JSON.parse(localStorage.getItem('french_week47_errors')||'[]')}catch{return []}}function markMistake(id){let s=new Set(mistakes());s.add(id);localStorage.setItem('french_week47_errors',JSON.stringify([...s]))}function clearMistakes(){localStorage.removeItem('french_week47_errors');renderMistakes()}function renderMistakes(){let ms=mistakes();$('mistakeList').innerHTML=ms.length?ms.map(id=>{let w=data[id];return `<div class="row"><span><b>${w.fr}</b><br><small>${w.sv}</small></span><button onclick="speak(data[${id}].fr)">🔊</button></div>`}).join(''):'还没有错题，继续加油！'}
$('wordlist').innerHTML='<table><thead><tr><th>#</th><th>Franska</th><th>Svenska</th><th>🔊</th></tr></thead><tbody>'+data.map((w,i)=>`<tr><td>${i+1}</td><td><b>${w.fr}</b></td><td>${w.sv}</td><td><button aria-label="播放 ${w.fr}" onclick="speak(data[${i}].fr)">🔊</button></td></tr>`).join('')+'</tbody></table>';
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('hide',s.id!==b.dataset.tab));if(b.dataset.tab==='mistakes')renderMistakes()}));
function currentCard(){return cardOrder[cardPos]}function renderCard(){$('cardCount').textContent=`${cardPos+1} / ${cardOrder.length}`;$('cardFr').textContent=currentCard().fr;$('cardSv').textContent=currentCard().sv;$('cardSv').hidden=true}function stepCard(n){cardPos=(cardPos+n+cardOrder.length)%cardOrder.length;renderCard()}function shuffleCards(){cardOrder=shuffle(data);cardPos=0;renderCard()}
function startChoices(order=data){choiceOrder=shuffle(order);choicePos=0;renderChoice()}function renderChoice(){choiceDone=false;let w=choiceOrder[choicePos];$('choiceCount').textContent=`${choicePos+1} / ${choiceOrder.length}`;$('choiceQ').textContent=w.sv;$('choiceFeedback').textContent='';$('choiceNext').disabled=true;let others=shuffle(data.filter(x=>x.id!==w.id)).slice(0,3);$('choiceOptions').innerHTML='';shuffle([w,...others]).forEach(x=>{let b=document.createElement('button');b.textContent=x.fr;b.onclick=()=>{if(choiceDone)return;choiceDone=true;let ok=x.id===w.id;if(!ok)markMistake(w.id);document.querySelectorAll('#choiceOptions button').forEach(btn=>{btn.disabled=true;if(btn.textContent===w.fr)btn.classList.add('correct');else if(btn===b)btn.classList.add('wrong')});$('choiceFeedback').textContent=ok?'✓ Rätt! 答对了！':`✗ 正确答案：${w.fr}`;speak(w.fr);$('choiceNext').disabled=false};$('choiceOptions').appendChild(b)})}function nextChoice(){if(choicePos+1>=choiceOrder.length){$('choiceFeedback').textContent='🎉 全部完成！点击下一题重新开始。';$('choiceNext').textContent='重新开始';$('choiceNext').onclick=()=>{startChoices();$('choiceNext').textContent='下一题 →';$('choiceNext').onclick=nextChoice};return}choicePos++;renderChoice()}
function startWrite(order=data){writeOrder=shuffle(order);writePos=0;renderWrite()}function renderWrite(){writeDone=false;$('writeCount').textContent=`${writePos+1} / ${writeOrder.length}`;$('writeQ').textContent=writeOrder[writePos].sv;$('answer').value='';$('answer').disabled=false;$('writeFeedback').textContent='';$('writeCheck').textContent='检查答案';$('answer').focus()}function norm(s){return s.toLocaleLowerCase('fr').normalize('NFC').replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/\s+([?!])/g,'$1').trim()}function checkOrNext(){if(writeDone){if(writePos+1===writeOrder.length){startWrite();return}writePos++;renderWrite();return}let w=writeOrder[writePos],v=$('answer').value.trim();if(!v)return;let ok=norm(v)===norm(w.fr);if(!ok)markMistake(w.id);$('writeFeedback').textContent=ok?'✓ Rätt! 答对了！':`✗ 正确答案：${w.fr}`;writeDone=true;$('answer').disabled=true;$('writeCheck').textContent=writePos+1===writeOrder.length?'重新开始':'下一题 →';speak(w.fr)}function showAnswer(){if(writeDone)return;$('answer').value=writeOrder[writePos].fr;markMistake(writeOrder[writePos].id);$('writeFeedback').textContent='答案已显示，点击检查答案继续。'}function startMistakePractice(){let arr=data.filter(x=>mistakes().includes(x.id));if(!arr.length){alert('目前没有错题');return}startWrite(arr);document.querySelector('[data-tab="write"]').click()}
renderCard();startChoices();startWrite();renderMistakes();</script></body></html>

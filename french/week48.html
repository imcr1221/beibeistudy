<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week47 · 法语重点单词</title><style>:root{font-family:system-ui,"Microsoft Yahei",sans-serif;color:#26334b;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#5575cf,#8d79d9);color:white;padding:34px max(20px,calc((100vw - 980px)/2))}h1{margin:8px 0}main{max-width:980px;margin:24px auto;padding:0 16px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.btn,button{border:0;border-radius:13px;padding:11px 17px;background:#e7edff;color:#314c96;font-weight:700;cursor:pointer}.btn{text-decoration:none}.active,button.primary{background:#536fcb;color:white}.panel{background:white;border-radius:20px;padding:23px;margin:17px 0;box-shadow:0 5px 22px #273b7310}.muted{color:#68758b}.pill{display:inline-block;background:#f0edff;padding:5px 11px;border-radius:20px;font-size:13px}.card{border:1px solid #e4e9f4;border-radius:15px;padding:17px;margin:12px 0}.fr{font-size:24px;color:#394f9c;font-weight:750}.sv{font-size:17px}.cn{color:#7b658d}input{width:100%;padding:13px;border:2px solid #dbe3f5;border-radius:12px;font-size:18px;margin:12px 0}button{margin:4px}.good{color:#14805d}.bad{color:#b54755}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.grid .card{margin:0}footer{text-align:center;color:#7d879b;padding:30px}select{padding:9px;border-radius:10px;border:1px solid #ccd6ee}@media(max-width:600px){header{padding:25px 18px}.fr{font-size:21px}.panel{padding:16px}}</style><header><div class="pill">贝贝 · Français 6</div><h1>Week47 · 法语重点单词</h1><div>Chapitre 2C · 单词听读与默写</div></header><main><div class="nav"><a class="btn" href="index.html">← 返回上一级</a><a class="btn" href="week47.html">Week47 单词</a><a class="btn" href="chapitre2.html">第2单元</a></div><div class="panel"><h2>📚 重点单词</h2><p class="muted">根据目前对话中可见的 Week47 单词表整理了前 7 项。后续单词尚未提供完整清单，暂不冒充原表内容。</p><div id="wordlist"></div></div><div class="panel"><h2>✍️ 瑞典语 → 法语默写</h2><div class="muted">可以使用法语重音符号；系统会提示是否正确。</div><div id="quiz"></div></div></main><footer>学习提示：先听读，再遮住答案，最后默写。</footer><script>let playing=null;function speak(t){if(playing){playing.pause();playing=null}speechSynthesis.cancel();let a=document.querySelector('audio[data-for="'+CSS.escape(t)+'"]');if(a){a.currentTime=0;a.play();playing=a;return}let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim()}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script><script>const words=[{fr:'les photos',sv:'fotona',cn:'这些照片'},{fr:'une femme',sv:'en kvinna',cn:'一位女性'},{fr:'la sœur de papa',sv:'pappas syster',cn:'爸爸的姐妹／姑姑'},{fr:'devant l’école',sv:'framför skolan',cn:'在学校前面'},{fr:'elle travaille',sv:'hon arbetar',cn:'她工作'},{fr:'là',sv:'där',cn:'那里'},{fr:'j’adore',sv:'jag älskar',cn:'我非常喜欢／我热爱'}];let qi=0,correct=0;document.getElementById('wordlist').innerHTML=words.map((w,i)=>`<div class="card"><span class="pill">${i+1}</span> <span class="fr">${esc(w.fr)}</span><button onclick="speak(words[${i}].fr)" data-tts-text="${esc(w.fr)}">🔊 听法语</button><div class="sv">🇸🇪 ${esc(w.sv)}</div><div class="cn">🇨🇳 ${esc(w.cn)}</div></div>`).join('');function render(){let w=words[qi];document.getElementById('quiz').innerHTML=`<span class="pill">第 ${qi+1} / ${words.length} 题</span><h3>${esc(w.sv)}</h3><div class="muted">${esc(w.cn)}</div><input id="answer" placeholder="输入法语" autocomplete="off"><button class="primary" onclick="check()">检查答案</button><button onclick="reveal()">显示答案</button><div id="feedback" aria-live="polite"></div>`;document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')check()}}function check(){let w=words[qi],v=document.getElementById('answer').value;let ok=normalize(v)===normalize(w.fr);document.getElementById('feedback').innerHTML=`<p class="${ok?'good':'bad'}">${ok?'✓ 正确！':'再试一次！'}</p>`+(ok?`<button class="primary" onclick="next()">下一题 →</button>`:'')}function reveal(){document.getElementById('feedback').innerHTML=`<p>正确答案：<b>${esc(words[qi].fr)}</b></p><button onclick="speak(words[qi].fr)">🔊 听发音</button><button onclick="next()">下一题 →</button>`}function next(){qi=(qi+1)%words.length;render()}render();</script></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法语 第40周｜我的学习小天地</title><link rel="stylesheet" href="../assets/style.css"><style>:root{--accent:#e56b83}</style></head><body><header class="top"><div class="brand">🇫🇷 法语 · 第40周</div><a class="back" href="index.html">← 返回法语目录</a></header><main class="wrap"><div class="head" style="margin-top:0"><div><h2>第40周学习</h2><p>学习学校用品词汇，并用简单句说出自己有什么。</p></div><span class="pill">WEEK 40</span></div><section class="panel"><h1 class="lesson-title">À l’école · 在学校</h1><p class="lead">学习学校用品词汇，并用简单句说出自己有什么。</p><div class="items"><div class="item"><span class="emo">📒</span><div><strong>un cahier</strong><span>一本练习本</span></div></div><div class="item"><span class="emo">✏️</span><div><strong>un crayon</strong><span>一支铅笔</span></div></div><div class="item"><span class="emo">🎒</span><div><strong>un sac</strong><span>一个书包</span></div></div><div class="item"><span class="emo">📏</span><div><strong>une règle</strong><span>一把尺子</span></div></div></div><div class="tip">💡 <strong>学习提示：</strong>法语名词有阴阳性。记单词时，把 un / une 和名词一起记。</div><div class="quiz"><h2>✏️ 本周小练习</h2><p><strong>“一本练习本”用法语怎么说？</strong></p><label class="option"><input type="radio" name="q" value="0"> un cahier</label><label class="option"><input type="radio" name="q" value="1"> une règle</label><label class="option"><input type="radio" name="q" value="2"> un sac</label><button class="primary" id="check">检查答案</button><button class="secondary" id="again">重新作答</button><span class="feedback" id="fb"></span><div class="tip answer hidden" id="answer"></div></div><div class="complete"><span id="doneText">完成学习和练习后，可以标记本周完成。</span><button id="done">✓ 标记完成</button></div></section></main><footer>🌱 第40周 · 法语</footer><script>
const KEY="kids-learning-progress",page="french-40",correct=0;let p=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"scores":{}}');
function refresh(){let d=p.done.includes(page);done.textContent=d?"✓ 已完成（点击取消）":"✓ 标记完成";doneText.textContent=d?"太棒了！第40周法语已经完成，可以随时回来复习。":"完成学习和练习后，可以标记本周完成。"}
check.onclick=()=>{let a=document.querySelector('input[name=q]:checked');if(!a){fb.textContent="请先选择一个答案。";return}let ok=+a.value===correct;p.scores[page]=ok?100:0;localStorage.setItem(KEY,JSON.stringify(p));fb.textContent=ok?"回答正确！🎉":"再想一想，看看解析。";answer.classList.remove("hidden");answer.innerHTML="💡 <strong>答案解析：</strong>un cahier = 一本练习本。"};
again.onclick=()=>{document.querySelectorAll('input[name=q]').forEach(x=>x.checked=false);fb.textContent="";answer.classList.add("hidden")};
done.onclick=()=>{if(p.done.includes(page))p.done=p.done.filter(x=>x!==page);else p.done.push(page);localStorage.setItem(KEY,JSON.stringify(p));refresh()};refresh();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文 第40周｜我的学习小天地</title><link rel="stylesheet" href="../assets/style.css"><style>:root{--accent:#e45b55}</style></head><body><header class="top"><div class="brand">📚 中文 · 第40周</div><a class="back" href="index.html">← 返回中文目录</a></header><main class="wrap"><div class="head" style="margin-top:0"><div><h2>第40周学习</h2><p>练习在中文句子中安排时间、地点和动作。</p></div><span class="pill">WEEK 40</span></div><section class="panel"><h1 class="lesson-title">句子表达：时间和地点</h1><p class="lead">练习在中文句子中安排时间、地点和动作。</p><div class="items"><div class="item"><span class="emo">🕒</span><div><strong>时间</strong><span>我每天放学后……</span></div></div><div class="item"><span class="emo">📍</span><div><strong>地点</strong><span>我在图书馆……</span></div></div><div class="item"><span class="emo">✍️</span><div><strong>动作</strong><span>我在图书馆看书。</span></div></div><div class="item"><span class="emo">🧩</span><div><strong>完整句子</strong><span>我每天放学后在图书馆看书。</span></div></div></div><div class="tip">💡 <strong>学习提示：</strong>常见表达顺序：主语 + 时间 + 地点 + 动作。</div><div class="quiz"><h2>✏️ 本周小练习</h2><p><strong>哪一句表达最自然？</strong></p><label class="option"><input type="radio" name="q" value="0"> 我看书在每天图书馆。</label><label class="option"><input type="radio" name="q" value="1"> 我每天放学后在图书馆看书。</label><label class="option"><input type="radio" name="q" value="2"> 在看书我图书馆每天。</label><button class="primary" id="check">检查答案</button><button class="secondary" id="again">重新作答</button><span class="feedback" id="fb"></span><div class="tip answer hidden" id="answer"></div></div><div class="complete"><span id="doneText">完成学习和练习后，可以标记本周完成。</span><button id="done">✓ 标记完成</button></div></section></main><footer>🌱 第40周 · 中文</footer><script>
const KEY="kids-learning-progress",page="chinese-40",correct=1;let p=JSON.parse(localStorage.getItem(KEY)||'{"done":[],"scores":{}}');
function refresh(){let d=p.done.includes(page);done.textContent=d?"✓ 已完成（点击取消）":"✓ 标记完成";doneText.textContent=d?"太棒了！第40周中文已经完成，可以随时回来复习。":"完成学习和练习后，可以标记本周完成。"}
check.onclick=()=>{let a=document.querySelector('input[name=q]:checked');if(!a){fb.textContent="请先选择一个答案。";return}let ok=+a.value===correct;p.scores[page]=ok?100:0;localStorage.setItem(KEY,JSON.stringify(p));fb.textContent=ok?"回答正确！🎉":"再想一想，看看解析。";answer.classList.remove("hidden");answer.innerHTML="💡 <strong>答案解析：</strong>时间和地点通常放在动作前。"};
again.onclick=()=>{document.querySelectorAll('input[name=q]').forEach(x=>x.checked=false);fb.textContent="";answer.classList.add("hidden")};
done.onclick=()=>{if(p.done.includes(page))p.done=p.done.filter(x=>x!==page);else p.done.push(page);localStorage.setItem(KEY,JSON.stringify(p));refresh()};refresh();
</script></body></html>

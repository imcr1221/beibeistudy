<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学原题在线练习 · 2012–2013</title><style>body{font:16px system-ui,'Microsoft YaHei',sans-serif;background:#f1f6ff;color:#233451;margin:0}.wrap{max-width:850px;margin:auto;padding:24px}a{color:#3566bd}.top,.item{background:white;border-radius:17px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #33446612}.item h3{margin:8px 0}.item p{line-height:1.7}input{padding:11px;border:1px solid #c5d2e7;border-radius:9px;width:220px;font-size:16px}button{background:#4168c7;color:white;border:0;padding:11px 16px;border-radius:9px;cursor:pointer;margin:7px 7px 7px 0}.muted{color:#64748b;font-size:14px}.ok{color:#187c51}.bad{color:#a54c31}select{padding:9px;border-radius:8px}.ans{margin-top:10px;background:#f0f5ff;border-radius:9px;padding:10px}</style><div class="wrap"><div class="top"><a href="../index.html">← 返回国家考试主页</a><h1>数学原题 · 在线练习</h1><p>来自你上传的2012、2013年官方样题，选取了可准确转换为文字输入的题目。图形题仍在原始 PDF 中。</p><label>年份 <select id="year"><option value="all">全部</option><option>2012</option><option>2013</option></select></label> <label>知识点 <select id="topic"><option value="all">全部</option></select></label><p class="muted" id="stat"></p><button id="export">导出学习记录 JSON</button><button id="wrong">只看错题</button></div><main id="items"></main><p class="muted">学习记录只保存在此浏览器。没有账号同步。主观题与图表题请用原 PDF 和官方评分标准。</p></div><script>const Q=[{"year": "2012", "id": "2", "q": "Alex, Sabina och Kim har samlat in många burkar. De får 612 kr när de pantar burkarna. Hur mycket får var och en om de delar lika?", "answer": "204", "topic": "除法 / Division", "explain": "612 ÷ 3 = 204 kr"}, {"year": "2012", "id": "4b", "q": "Sabina åker hemifrån 45 minuter innan idrottsdagen börjar. Idrottsdagen börjar kl. 08.20. Hur dags åker hon hemifrån?", "answer": "07:35", "topic": "时间 / Tid", "explain": "08.20 − 45 minuter = 07.35"}, {"year": "2012", "id": "5b", "q": "Hur många sekunder snabbare sprang Alex (12,7 s) jämfört med Hanna (13,2 s)?", "answer": "0,5", "topic": "小数 / Decimaltal", "explain": "13,2 − 12,7 = 0,5 s"}, {"year": "2012", "id": "6a", "q": "6 · 70 = ?", "answer": "420", "topic": "乘法 / Multiplikation", "explain": "6 × 70 = 420"}, {"year": "2012", "id": "6b", "q": "72 ÷ 8 = ?", "answer": "9", "topic": "除法 / Division", "explain": "72 ÷ 8 = 9"}, {"year": "2012", "id": "7a", "q": "Skriv talet med siffror: Tolvtusensextio", "answer": "12060", "topic": "数位 / Taluppfattning", "explain": "Tolvtusensextio = 12 060"}, {"year": "2012", "id": "9c", "q": "Lös ekvationen: 2 · x + 3 = 11", "answer": "4", "topic": "方程 / Ekvation", "explain": "2x = 8, x = 4"}, {"year": "2012", "id": "12", "q": "När Anton arbetar i skolans kafé i 20 minuter får han välja varor för 10 kr. Hur länge måste han arbeta för att få välja varor för 25 kr?", "answer": "50", "topic": "比例 / Proportionalitet", "explain": "20 × 25 ÷ 10 = 50 minuter"}, {"year": "2012", "id": "14", "q": "Till invigningen kommer det 180 personer, både vuxna och ungdomar. Det kommer dubbelt så många ungdomar som vuxna. Hur många ungdomar kommer?", "answer": "120", "topic": "应用题 / Problemlösning", "explain": "180 ÷ 3 × 2 = 120"}, {"year": "2013", "id": "1a", "q": "798 + 10 = ?", "answer": "808", "topic": "加法 / Addition", "explain": "798 + 10 = 808"}, {"year": "2013", "id": "1c", "q": "302 − 297 = ?", "answer": "5", "topic": "减法 / Subtraktion", "explain": "302 − 297 = 5"}, {"year": "2013", "id": "4", "q": "På en miniräknare står det 0,657. Vilket tal ska du subtrahera med för att ”femman” ska ändras till en ”tvåa”?", "answer": "0,03", "topic": "小数 / Decimaltal", "explain": "0,657 − 0,03 = 0,627"}, {"year": "2013", "id": "6c", "q": "100 · ____ = 30", "answer": "0,3", "topic": "小数 / Decimaltal", "explain": "30 ÷ 100 = 0,3"}, {"year": "2013", "id": "7c", "q": "Lös ekvationen: 32 = 2 · x + 8", "answer": "12", "topic": "方程 / Ekvation", "explain": "32 − 8 = 24, x = 12"}, {"year": "2013", "id": "8a", "q": "Du vet att 12 · 167,5 = 2 010. Vad är 6 · 167,5?", "answer": "1005", "topic": "数学推理 / Resonemang", "explain": "2010 ÷ 2 = 1005"}];let records={};try{records=JSON.parse(localStorage.getItem('np6-math-q-1')||'{}')}catch(e){}let onlyWrong=false;const $=s=>document.querySelector(s);const save=()=>localStorage.setItem('np6-math-q-1',JSON.stringify(records));const norm=s=>String(s).trim().replace(/\s/g,'').replace('.',',');let topics=[...new Set(Q.map(q=>q.topic))];topics.forEach(t=>{let o=document.createElement('option');o.value=t;o.textContent=t;$('#topic').append(o)});function render(){let filt=Q.filter(q=>($('#year').value==='all'||q.year===$('#year').value)&&($('#topic').value==='all'||q.topic===$('#topic').value)&&(!onlyWrong||records[q.year+'-'+q.id]?.status==='wrong'));$('#items').innerHTML='';filt.forEach(q=>{let key=q.year+'-'+q.id,r=records[key]||{},el=document.createElement('section');el.className='item';el.innerHTML='<div class="muted"></div><h3></h3><p></p><label>答案 <input autocomplete="off"></label><div><button class="check">检查答案</button><button class="reveal">显示解法</button></div><div class="ans" hidden></div>';el.querySelector('.muted').textContent=q.year+' · 第 '+q.id+' 题 · '+q.topic;el.querySelector('h3').textContent='Uppgift '+q.id;el.querySelector('p').textContent=q.q;let inp=el.querySelector('input'),ans=el.querySelector('.ans');inp.value=r.input||'';function show(correct){ans.hidden=false;ans.textContent=(correct?'✓ 正确。':'✗ 请再试。')+' 参考答案：'+q.answer+'。 '+q.explain;ans.className='ans '+(correct?'ok':'bad')}el.querySelector('.check').onclick=()=>{let val=inp.value,correct=norm(val)===norm(q.answer);records[key]={input:val,status:correct?'correct':'wrong',date:new Date().toISOString()};save();show(correct);updateStat()};el.querySelector('.reveal').onclick=()=>{ans.hidden=false;ans.textContent='参考答案：'+q.answer+'。 '+q.explain};$('#items').append(el)});updateStat()}function updateStat(){let n=Object.values(records);$('#stat').textContent='已检查 '+n.length+' 题 · 正确 '+n.filter(x=>x.status==='correct').length+' 题 · 待复习 '+n.filter(x=>x.status==='wrong').length+' 题'}$('#year').onchange=render;$('#topic').onchange=render;$('#wrong').onclick=()=>{onlyWrong=!onlyWrong;$('#wrong').textContent=onlyWrong?'显示全部':'只看错题';render()};$('#export').onclick=()=>{let b=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='matematik-ovningar.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};render();</script></html>
